[project]
name = "ball-knowledge"
version = "0.1.0"
description = "Ball Knowledge: a Gemini tool-calling chat agent that serves real, spicy NBA takes from Reddit with ESPN stat receipts"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
