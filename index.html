<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ball Knowledge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --space: #07080f;
                --paper: #ffffff;
                --ink: #0b0c10;
                --ink-soft: #4a4f5c;
                --line: #0b0c10;
                --faint: rgba(255, 255, 255, 0.55);
                --orange: #f26a1b;
                --good: #0f9d63;
                --bad: #d6334a;
                --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--space);
                color: #fff;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            button {
                font: inherit;
                cursor: pointer;
            }

            /* --- Starfield: two layers of tiny dots that twinkle out of sync --- */
            .stars,
            .stars::after {
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background-image:
                    radial-gradient(1px 1px at 25px 35px, #fff, transparent),
                    radial-gradient(1px 1px at 140px 80px, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 90px 160px, #fff, transparent),
                    radial-gradient(1px 1px at 200px 220px, #fff, transparent),
                    radial-gradient(1px 1px at 260px 60px, #fff, transparent);
                background-size: 300px 260px;
                opacity: 0.45;
                animation: twinkle 5s ease-in-out infinite alternate;
            }
            .stars::after {
                content: "";
                background-size: 410px 370px;
                background-position: 120px 90px;
                animation-delay: -2.5s;
            }
            @keyframes twinkle {
                to {
                    opacity: 0.15;
                }
            }
            .shooting-star {
                position: fixed;
                top: 12%;
                left: 70%;
                z-index: -1;
                width: 90px;
                height: 1px;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), transparent);
                transform: rotate(-20deg);
                opacity: 0;
                animation: shoot 9s ease-out infinite 2s;
            }
            @keyframes shoot {
                0% {
                    opacity: 0;
                    transform: rotate(-20deg) translateX(0);
                }
                3% {
                    opacity: 1;
                }
                10%,
                100% {
                    opacity: 0;
                    transform: rotate(-20deg) translateX(-260px);
                }
            }

            /* --- Header --- */
            header {
                width: 100%;
                max-width: 1100px;
                margin: 0 auto;
                padding: 1.25rem 1.25rem 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 0.8rem;
                letter-spacing: 0.14em;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .box-btn {
                background: var(--paper);
                color: var(--ink);
                border: 1.5px solid var(--line);
                border-radius: 6px;
                padding: 0.45rem 0.85rem;
                font-family: var(--mono);
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .box-btn:hover {
                background: #e9eaee;
            }

            /* --- Layout --- */
            main {
                flex: 1;
                width: 100%;
                max-width: 720px;
                margin: 0 auto;
                padding: 0 1.25rem;
                display: flex;
                flex-direction: column;
            }

            /* --- Welcome: floating basketball + title --- */
            #welcome {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 2.5rem 0 1rem;
            }
            #welcome[hidden] {
                display: none;
            }
            .ball-scene {
                position: relative;
                width: 150px;
                height: 190px;
            }
            .ball {
                position: absolute;
                top: 0;
                left: 0;
                width: 150px;
                height: 150px;
                border-radius: 50%;
                overflow: hidden;
                /* Light from the top-left, shadow bottom-right, so it reads as a sphere. */
                background: radial-gradient(circle at 34% 28%, #ffb27a 0%, #f26a1b 38%, #b8470b 72%, #5c2104 100%);
                box-shadow:
                    inset -16px -20px 34px rgba(0, 0, 0, 0.45),
                    0 0 70px rgba(242, 106, 27, 0.28);
                animation: float 5s ease-in-out infinite;
            }
            .ball svg {
                width: 100%;
                height: 100%;
                animation: spin 14s linear infinite;
            }
            .ball-shadow {
                position: absolute;
                bottom: 0;
                left: 30px;
                width: 90px;
                height: 12px;
                border-radius: 50%;
                background: rgba(242, 106, 27, 0.25);
                filter: blur(6px);
                animation: shadow 5s ease-in-out infinite;
            }
            @keyframes float {
                50% {
                    transform: translateY(-14px);
                }
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes shadow {
                50% {
                    transform: scale(0.75);
                    opacity: 0.6;
                }
            }
            #welcome h1 {
                margin-top: 1.25rem;
                font-size: clamp(2.6rem, 9vw, 4.2rem);
                font-weight: 800;
                letter-spacing: -0.045em;
                line-height: 1;
            }
            .kicker {
                margin-top: 0.8rem;
                font-family: var(--mono);
                font-size: 0.75rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--faint);
            }
            #welcome p.lede {
                margin-top: 1rem;
                max-width: 30rem;
                color: rgba(255, 255, 255, 0.7);
                line-height: 1.55;
            }

            /* Numbered starter prompts, in a white panel. */
            .starter {
                margin-top: 1.75rem;
                width: 100%;
                max-width: 440px;
                background: var(--paper);
                color: var(--ink);
                border: 1.5px solid var(--line);
                border-radius: 10px;
                padding: 0.9rem;
                text-align: left;
            }
            .starter .eyebrow {
                margin-bottom: 0.6rem;
            }
            .starter button {
                width: 100%;
                display: flex;
                gap: 0.9rem;
                align-items: center;
                background: var(--paper);
                color: var(--ink);
                border: 1.5px solid var(--line);
                border-radius: 6px;
                padding: 0.6rem 0.75rem;
                margin-top: 0.45rem;
                font-size: 0.9rem;
                text-align: left;
            }
            .starter button:hover {
                background: #f1f2f5;
            }
            .starter button span {
                font-family: var(--mono);
                font-size: 0.72rem;
                color: var(--ink-soft);
            }

            /* --- Messages --- */
            #messages {
                display: flex;
                flex-direction: column;
                gap: 1.75rem;
                padding: 1.5rem 0;
            }
            .msg.user {
                align-self: flex-end;
                max-width: 80%;
                border: 1.5px solid rgba(255, 255, 255, 0.85);
                border-radius: 8px;
                padding: 0.6rem 0.9rem;
                line-height: 1.5;
            }
            .msg.assistant {
                display: flex;
                flex-direction: column;
                gap: 0.7rem;
                line-height: 1.6;
            }
            .lead-in {
                color: rgba(255, 255, 255, 0.8);
            }
            .plain strong {
                font-weight: 700;
            }
            .plain ul {
                margin: 0.4rem 0 0 1.2rem;
            }
            .error {
                color: #ff8a9a;
            }
            .tools-used {
                font-family: var(--mono);
                font-size: 0.68rem;
                letter-spacing: 0.08em;
                color: rgba(255, 255, 255, 0.4);
            }

            /* Cards rise into place, one after another. */
            .rise {
                animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
            }

            /* --- Loading --- */
            .thinking {
                display: flex;
                align-items: center;
                gap: 0.7rem;
                font-family: var(--mono);
                font-size: 0.75rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--faint);
                min-height: 2rem;
            }
            .thinking .bounce {
                display: inline-block;
                font-size: 1.25rem;
                animation: bounce 0.6s cubic-bezier(0.5, 0, 0.5, 1) infinite alternate;
            }
            @keyframes bounce {
                from {
                    transform: translateY(-6px) rotate(0deg);
                }
                to {
                    transform: translateY(4px) rotate(90deg);
                }
            }
            .dots::after {
                content: "";
                animation: dots 1.2s steps(4) infinite;
            }
            @keyframes dots {
                0% {
                    content: "";
                }
                25% {
                    content: ".";
                }
                50% {
                    content: "..";
                }
                75% {
                    content: "...";
                }
            }

            /* --- White paper cards --- */
            .card {
                background: var(--paper);
                color: var(--ink);
                border: 1.5px solid var(--line);
                border-radius: 10px;
                padding: 1rem 1.1rem;
                box-shadow: 0 20px 50px -25px rgba(0, 0, 0, 0.9);
            }
            .eyebrow {
                display: block;
                font-family: var(--mono);
                font-size: 0.66rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--ink-soft);
            }

            /* Take: the main card */
            .hero-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.75rem;
                flex-wrap: wrap;
                padding-bottom: 0.75rem;
                border-bottom: 1.5px solid var(--line);
            }
            .rating {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }
            .meter {
                display: flex;
                gap: 3px;
            }
            .meter span {
                width: 16px;
                height: 8px;
                border: 1.5px solid var(--line);
                border-radius: 2px;
            }
            .meter span.on {
                background: var(--orange);
            }
            .rating-score {
                font-family: var(--mono);
                font-size: 0.75rem;
                font-weight: 700;
            }
            .rating-score small {
                font-weight: 400;
                color: var(--ink-soft);
                margin-left: 0.35rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }
            .source {
                font-family: var(--mono);
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--ink);
                text-decoration: none;
                border: 1.5px solid var(--line);
                border-radius: 6px;
                padding: 0.25rem 0.55rem;
            }
            .source:hover {
                background: #f1f2f5;
            }
            .take-text {
                font-size: clamp(1.4rem, 4vw, 1.9rem);
                font-weight: 700;
                line-height: 1.3;
                letter-spacing: -0.025em;
                margin: 0.9rem 0;
            }
            .original {
                font-size: 0.82rem;
                color: var(--ink-soft);
            }
            .original b {
                font-family: var(--mono);
                font-size: 0.66rem;
                letter-spacing: 0.1em;
                margin-right: 0.35rem;
            }

            /* Take: tiles under the main card */
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.7rem;
            }
            .stat-big {
                display: flex;
                align-items: baseline;
                gap: 0.45rem;
                margin: 0.5rem 0 0.1rem;
            }
            .stat-big b {
                font-size: 2.6rem;
                font-weight: 800;
                letter-spacing: -0.04em;
                line-height: 1;
            }
            .stat-big span {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 0.8rem;
            }
            .delta {
                font-family: var(--mono);
                font-size: 0.7rem;
                font-weight: 700;
            }
            .delta.up {
                color: var(--good);
            }
            .delta.down {
                color: var(--bad);
            }
            .note {
                font-family: var(--mono);
                font-size: 0.68rem;
                color: var(--ink-soft);
            }
            .card p {
                font-size: 0.92rem;
                margin-top: 0.5rem;
            }

            /* Argument: your friend vs you */
            .exchange {
                display: flex;
                flex-direction: column;
                gap: 0.55rem;
            }
            .bubble {
                max-width: 85%;
                padding: 0.7rem 0.9rem;
                border-radius: 10px;
                font-size: 0.95rem;
            }
            .bubble .eyebrow {
                margin-bottom: 0.25rem;
            }
            .bubble.friend {
                align-self: flex-start;
                border: 1.5px dashed rgba(255, 255, 255, 0.45);
                color: rgba(255, 255, 255, 0.9);
            }
            .bubble.friend .eyebrow {
                color: var(--faint);
            }
            .bubble.you {
                align-self: flex-end;
                background: var(--paper);
                color: var(--ink);
                border: 1.5px solid var(--line);
                box-shadow: 0 20px 50px -25px rgba(0, 0, 0, 0.9);
            }

            /* Head-to-head stats */
            .h2h table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 0.6rem;
                font-variant-numeric: tabular-nums;
            }
            .h2h th {
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                padding-bottom: 0.45rem;
            }
            .h2h th small {
                display: block;
                font-family: var(--mono);
                font-weight: 400;
                color: var(--ink-soft);
                font-size: 0.66rem;
            }
            .h2h td {
                padding: 0.45rem 0;
                border-top: 1px solid #dfe1e6;
                text-align: center;
                font-weight: 500;
            }
            .h2h td.label {
                font-family: var(--mono);
                color: var(--ink-soft);
                font-size: 0.7rem;
                font-weight: 700;
                width: 22%;
            }
            .h2h td.win {
                font-weight: 800;
            }
            .h2h td.win::after {
                content: " ●";
                color: var(--orange);
                font-size: 0.6rem;
                vertical-align: middle;
            }

            /* Reddit replies + copy */
            details.card {
                font-size: 0.88rem;
            }
            summary {
                cursor: pointer;
                font-family: var(--mono);
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            details .eyebrow {
                margin-top: 0.8rem;
            }
            details ul {
                margin: 0.3rem 0 0 1.1rem;
            }
            details li {
                margin-bottom: 0.35rem;
            }
            .actions {
                display: flex;
                gap: 0.6rem;
                align-items: center;
            }

            /* --- Composer --- */
            .composer {
                position: sticky;
                bottom: 0;
                margin-top: auto;
                padding: 0.75rem 0 1.25rem;
                background: linear-gradient(transparent, var(--space) 30%);
            }
            .chips {
                display: flex;
                gap: 0.45rem;
                overflow-x: auto;
                padding-bottom: 0.6rem;
                scrollbar-width: none;
            }
            .chips[hidden] {
                display: none;
            }
            .chip {
                flex: none;
                background: transparent;
                color: rgba(255, 255, 255, 0.85);
                border: 1.5px solid rgba(255, 255, 255, 0.35);
                border-radius: 6px;
                padding: 0.4rem 0.7rem;
                font-family: var(--mono);
                font-size: 0.7rem;
            }
            .chip:hover {
                border-color: #fff;
                color: #fff;
            }
            .input-row {
                display: flex;
                gap: 0.45rem;
                background: var(--paper);
                border: 1.5px solid var(--line);
                border-radius: 10px;
                padding: 0.4rem;
            }
            #user-input {
                flex: 1;
                min-width: 0;
                background: none;
                border: 1.5px solid var(--line);
                border-radius: 6px;
                outline: none;
                color: var(--ink);
                font-family: var(--mono);
                font-size: 0.85rem;
                padding: 0.6rem 0.75rem;
            }
            #user-input:focus {
                box-shadow: 0 0 0 3px rgba(242, 106, 27, 0.25);
            }
            #send-btn {
                width: 2.6rem;
                background: var(--ink);
                color: #fff;
                border: none;
                border-radius: 6px;
                font-size: 1.1rem;
            }
            .footnote {
                margin-top: 0.55rem;
                text-align: center;
                font-family: var(--mono);
                font-size: 0.64rem;
                letter-spacing: 0.06em;
                color: rgba(255, 255, 255, 0.35);
            }
            button:disabled {
                opacity: 0.4;
                cursor: wait;
            }

            @media (max-width: 600px) {
                .grid {
                    grid-template-columns: 1fr;
                }
                .msg.user,
                .bubble {
                    max-width: 92%;
                }
                .ball-scene {
                    transform: scale(0.8);
                }
            }
        </style>
    </head>
    <body>
        <div class="stars"></div>
        <div class="shooting-star"></div>

        <header>
            <div class="brand">🏀 BALL KNOWLEDGE</div>
            <button class="box-btn" id="new-chat">New chat</button>
        </header>

        <main>
            <section id="welcome">
                <div class="ball-scene" aria-hidden="true">
                    <div class="ball">
                        <!-- The seams of a basketball; the whole drawing slowly spins. -->
                        <svg viewBox="0 0 100 100" fill="none" stroke="#2b1004" stroke-width="2.2">
                            <path d="M50 0 Q57 50 50 100" />
                            <path d="M0 50 Q50 43 100 50" />
                            <path d="M17 9 Q43 50 17 91" />
                            <path d="M83 9 Q57 50 83 91" />
                        </svg>
                    </div>
                    <div class="ball-shadow"></div>
                </div>
                <h1>Ball Knowledge</h1>
                <div class="kicker">Sound like you watch every game</div>
                <p class="lede">
                    Friends into the NBA and you're not? Get a real, spicy take from Reddit fans, backed
                    by a real stat, plus what to say when they push back.
                </p>
                <div class="starter">
                    <span class="eyebrow">Try one</span>
                    <button data-prompt="Give me a niche take"><span>01</span>Give me a niche take</button>
                    <button data-prompt="Give me a niche take about Stephen Curry">
                        <span>02</span>Give me a niche take about Stephen Curry
                    </button>
                    <button data-prompt="My friend says that's a terrible take, what do I say?">
                        <span>03</span>My friend says that's a terrible take, what do I say?
                    </button>
                </div>
            </section>

            <div id="messages"></div>

            <div class="composer">
                <div class="chips" id="chips" hidden>
                    <button class="chip" data-prompt="Give me a niche take">Another take</button>
                    <button class="chip" data-prompt="Give me a really spicy take">Something spicier</button>
                    <button class="chip" data-prompt="My friend says that's a terrible take, what do I say?">
                        My friend disagrees
                    </button>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="user-input"
                        placeholder="Ask for a take on any player or team…"
                        autocomplete="off"
                        maxlength="500"
                    />
                    <button id="send-btn" aria-label="Send">→</button>
                </div>
                <div class="footnote">GEMINI · TAKES FROM REDDIT · STATS FROM ESPN</div>
            </div>
        </main>

        <script>
            const messages = document.getElementById("messages");
            const welcome = document.getElementById("welcome");
            const chips = document.getElementById("chips");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");

            // Each browser tab is its own session: sessionStorage is per-tab.
            let sessionId = sessionStorage.getItem("ballKnowledgeSession");

            // Friendly names for the tools, shown in a small line under each answer.
            const TOOL_LABELS = {
                find_hot_takes: "REDDIT TAKES",
                get_stat_receipts: "ESPN STATS",
                prep_for_pushback: "REDDIT REPLIES",
            };

            // --- Small helpers ---

            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Plain text: remove markdown bold and escapes like "\#1".
            function clean(text) {
                return (text || "").replace(/\\([#*_\-])/g, "$1").replace(/\*\*/g, "").trim();
            }

            // For answers that aren't a take or an argument: escape, then allow **bold** and bullets.
            function renderPlain(text) {
                const lines = escapeHtml((text || "").replace(/\\([#*_\-])/g, "$1")).split("\n");
                let html = "";
                let inList = false;
                for (const line of lines) {
                    const bullet = line.match(/^\s*[-*]\s+(.*)/);
                    if (bullet && !inList) html += "<ul>";
                    if (!bullet && inList) html += "</ul>";
                    inList = Boolean(bullet);
                    html += bullet ? "<li>" + bullet[1] + "</li>" : line + "<br>";
                }
                if (inList) html += "</ul>";
                return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            }

            function parse(result) {
                try {
                    return JSON.parse(result);
                } catch {
                    return {};
                }
            }

            function scrollDown() {
                window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
            }

            // Add a block to a message with a staggered rise animation.
            function place(body, node) {
                node.classList.add("rise");
                node.style.animationDelay = body.children.length * 70 + "ms";
                body.appendChild(node);
                return node;
            }

            // --- Reading the model's answer ---

            // Split the answer into the lines before any label (intro), and "**Label:** text" parts.
            // Labels come from the system prompt: The take / The receipt / Spice / If they push back,
            // and They'll say / You say / Say this.
            function sections(text) {
                const intro = [];
                const parts = [];
                for (const raw of (text || "").split("\n")) {
                    const line = raw.replace(/^\s*[-*]\s+/, "").trim();
                    if (!line) continue;
                    const labelled = line.match(/^\*\*([^*]+?):?\*\*:?\s*(.*)$/);
                    if (labelled) parts.push({ label: labelled[1].toLowerCase(), text: labelled[2] });
                    else if (parts.length) parts[parts.length - 1].text += " " + line;
                    else intro.push(line);
                }
                return { intro: intro.join(" "), parts };
            }

            function partText(parts, label) {
                const part = parts.find((p) => p.label === label);
                return part ? clean(part.text) : "";
            }

            // --- Building blocks ---

            function ratingMeter(level, label) {
                const box = el("div", "rating");
                box.appendChild(el("span", "eyebrow", "Take rating"));
                const meter = el("div", "meter");
                for (let i = 1; i <= 5; i++) meter.appendChild(el("span", i <= level ? "on" : ""));
                box.appendChild(meter);
                const score = el("span", "rating-score", level + "/5");
                if (label) score.appendChild(el("small", "", label));
                box.appendChild(score);
                return box;
            }

            function heroCard(takeText, take) {
                const card = el("div", "card");
                const top = el("div", "hero-top");
                top.appendChild(ratingMeter(take.spice, take.spice_label));
                const link = el("a", "source", "R/" + take.subreddit.toUpperCase() + " ↗");
                link.href = take.url;
                link.target = "_blank";
                link.rel = "noopener";
                top.appendChild(link);
                card.appendChild(top);
                // The credit lives on the source link, so drop "via r/..." from the big text.
                card.appendChild(el("p", "take-text", takeText.replace(/[,(\s]*via r\/\w+\)?\.?$/i, ".")));
                const original = el("p", "original");
                original.appendChild(el("b", "", "ORIGINAL POST"));
                original.appendChild(document.createTextNode("“" + take.title + "”"));
                card.appendChild(original);
                return card;
            }

            function receiptTile(stats, receiptText) {
                const tile = el("div", "card");
                tile.appendChild(el("span", "eyebrow", "The receipt"));
                const swing = stats && stats.biggest_swings && stats.biggest_swings[0];
                if (swing) {
                    const big = el("div", "stat-big");
                    big.appendChild(el("b", "", swing.season));
                    big.appendChild(el("span", "", swing.stat));
                    const up = swing.change_pct >= 0;
                    big.appendChild(el("span", "delta " + (up ? "up" : "down"), (up ? "▲" : "▼") + Math.abs(swing.change_pct) + "%"));
                    tile.appendChild(big);
                    tile.appendChild(el("span", "note", "vs " + swing.career + " career avg · " + stats.season.replace(" regular season", "")));
                }
                if (receiptText) tile.appendChild(el("p", "", receiptText));
                return tile;
            }

            function textTile(eyebrow, text) {
                const tile = el("div", "card");
                tile.appendChild(el("span", "eyebrow", eyebrow));
                tile.appendChild(el("p", "", text));
                return tile;
            }

            function bubble(who, text) {
                const node = el("div", "bubble " + who);
                node.appendChild(el("span", "eyebrow", who === "friend" ? "Your friend" : "You"));
                node.appendChild(document.createTextNode(text));
                return node;
            }

            // Side-by-side stats for two (or more) players; the better number in each row gets a dot.
            function headToHead(players) {
                const tile = el("div", "card h2h");
                tile.appendChild(el("span", "eyebrow", "Head to head"));
                const table = el("table");
                const head = el("tr");
                head.appendChild(el("th"));
                for (const p of players) {
                    const th = el("th", "", p.player);
                    th.appendChild(el("small", "", p.season.replace(" regular season", "")));
                    head.appendChild(th);
                }
                table.appendChild(head);
                for (const stat of ["PTS", "REB", "AST", "FG%", "3P%", "FT%"]) {
                    const values = players.map((p) => p.season_averages[stat]);
                    const best = Math.max(...values.filter((v) => v !== undefined));
                    const row = el("tr");
                    row.appendChild(el("td", "label", stat));
                    for (const v of values) row.appendChild(el("td", v === best ? "win" : "", v === undefined ? "–" : v));
                    table.appendChild(row);
                }
                tile.appendChild(table);
                return tile;
            }

            // The real Reddit replies behind a pushback answer, collapsed by default.
            function redditReplies(data) {
                const box = el("details", "card");
                box.appendChild(el("summary", "", "See what Redditors actually said"));
                const lists = [
                    ["Arguments against it", data.counterarguments],
                    ["How the original poster defended it", data.op_defenses],
                ];
                for (const [heading, items] of lists) {
                    if (!items || !items.length) continue;
                    box.appendChild(el("span", "eyebrow", heading));
                    const ul = el("ul");
                    for (const item of items) ul.appendChild(el("li", "", item.text));
                    box.appendChild(ul);
                }
                return box;
            }

            function copyButton(text) {
                const copy = el("button", "box-btn", "Copy take");
                copy.addEventListener("click", async () => {
                    try {
                        await navigator.clipboard.writeText(text);
                        copy.textContent = "Copied ✓";
                    } catch {
                        copy.textContent = "Couldn't copy";
                    }
                    setTimeout(() => (copy.textContent = "Copy take"), 1500);
                });
                return copy;
            }

            // "REDDIT TAKES · ESPN STATS": which tools this answer used.
            function toolsUsed(calls) {
                const names = [...new Set(calls.map((c) => TOOL_LABELS[c.name] || c.name))];
                return el("span", "tools-used", names.join(" · "));
            }

            // --- Filling an assistant message ---

            function fillAssistant(body, data) {
                body.innerHTML = "";

                const calls = data.tool_calls || [];
                const results = (name) =>
                    calls.filter((c) => c.name === name).map((c) => parse(c.result)).filter((r) => !r.error);
                const take = results("find_hot_takes").map((r) => r.takes && r.takes[0]).find(Boolean);
                const stats = results("get_stat_receipts");
                const pushback = results("prep_for_pushback")[0];

                const { intro, parts } = sections(data.response);
                const takeText = partText(parts, "the take");
                const actions = el("div", "actions");

                if (takeText && take) {
                    // A take: main card, then the receipt and the comeback side by side.
                    if (intro) place(body, el("p", "lead-in", clean(intro)));
                    place(body, heroCard(takeText, take));
                    const grid = el("div", "grid");
                    grid.appendChild(receiptTile(stats[0], partText(parts, "the receipt")));
                    grid.appendChild(textTile("If they push back", partText(parts, "if they push back")));
                    place(body, grid);
                    actions.appendChild(copyButton(takeText));
                } else if (parts.some((p) => ["they'll say", "you say", "say this"].includes(p.label))) {
                    // An argument: a back-and-forth between your friend and you.
                    if (intro) place(body, el("p", "lead-in", clean(intro)));
                    const exchange = el("div", "exchange");
                    for (const part of parts) {
                        if (part.label === "they'll say") exchange.appendChild(bubble("friend", clean(part.text)));
                        else exchange.appendChild(bubble("you", clean(part.text)));
                    }
                    place(body, exchange);
                    if (stats.length >= 2) place(body, headToHead(stats));
                    if (pushback) place(body, redditReplies(pushback));
                } else {
                    // Anything else (greetings, errors, off-topic): plain text.
                    const text = el("div", "plain");
                    text.innerHTML = renderPlain(data.response);
                    place(body, text);
                    if (stats.length >= 2) place(body, headToHead(stats));
                    if (pushback) place(body, redditReplies(pushback));
                }

                if (calls.length) actions.appendChild(toolsUsed(calls));
                if (actions.children.length) place(body, actions);
            }

            // --- Sending ---

            function addAssistant() {
                const body = el("div", "msg assistant");
                const thinking = el("div", "thinking");
                thinking.appendChild(el("span", "bounce", "🏀"));
                thinking.appendChild(el("span", "dots", "Generating original thoughts"));
                body.appendChild(thinking);
                messages.appendChild(body);
                return body;
            }

            async function send(text) {
                text = (text || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                welcome.hidden = true;
                chips.hidden = false;
                userInput.value = "";
                sendBtn.disabled = true;
                messages.appendChild(el("div", "msg user", text));
                const body = addAssistant();
                scrollDown();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });
                    if (!res.ok) throw new Error("Server said " + res.status);
                    const data = await res.json();
                    sessionId = data.session_id;
                    sessionStorage.setItem("ballKnowledgeSession", sessionId);
                    fillAssistant(body, data);
                } catch (e) {
                    body.innerHTML = "";
                    body.appendChild(
                        el(
                            "p",
                            "error",
                            "Couldn't reach Ball Knowledge (" + e.message + "). Check your connection and try again.",
                        ),
                    );
                }
                sendBtn.disabled = false;
                userInput.focus();
                scrollDown();
            }

            function newChat() {
                if (sessionId) {
                    fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" }).catch(() => {});
                }
                sessionId = null;
                sessionStorage.removeItem("ballKnowledgeSession");
                messages.innerHTML = "";
                welcome.hidden = false;
                chips.hidden = true;
                userInput.focus();
            }

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") send();
            });
            document.querySelectorAll("[data-prompt]").forEach((button) =>
                button.addEventListener("click", () => send(button.dataset.prompt)),
            );
            document.getElementById("new-chat").addEventListener("click", newChat);
            userInput.focus();
        </script>
    </body>
</html>
