<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ball Knowledge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0c0f15;
                --surface: #151a23;
                --surface-2: #1c2330;
                --line: #262e3c;
                --text: #e9edf3;
                --muted: #8b95a5;
                --accent: #ff7a1a;
                --accent-soft: rgba(255, 122, 26, 0.12);
                --good: #3ddc97;
                --bad: #ff6b7d;
                --display: "Anton", Impact, "Arial Narrow", sans-serif;
                --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 40px -18px rgba(0, 0, 0, 0.8);
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            button {
                font: inherit;
                cursor: pointer;
            }

            /* --- Header --- */
            header {
                position: sticky;
                top: 0;
                z-index: 2;
                background: rgba(12, 15, 21, 0.85);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid var(--line);
            }
            .bar {
                max-width: 760px;
                margin: 0 auto;
                padding: 0.85rem 1rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 0.55rem;
                font-family: var(--display);
                font-size: 1.35rem;
                letter-spacing: 0.04em;
                white-space: nowrap;
            }
            #new-chat {
                background: none;
                border: 1px solid var(--line);
                color: var(--muted);
                border-radius: 999px;
                padding: 0.4rem 0.9rem;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            #new-chat:hover {
                color: var(--text);
                border-color: var(--muted);
            }

            /* --- Layout --- */
            main {
                flex: 1;
                width: 100%;
                max-width: 760px;
                margin: 0 auto;
                padding: 0 1rem;
                display: flex;
                flex-direction: column;
            }

            /* --- Welcome (shown until the first message) --- */
            #welcome {
                text-align: center;
                padding: 3.5rem 0 2rem;
            }
            #welcome h1 {
                font-family: var(--display);
                font-weight: 400;
                font-size: clamp(2rem, 7vw, 3rem);
                letter-spacing: 0.02em;
                line-height: 1.1;
            }
            #welcome h1 span {
                color: var(--accent);
            }
            #welcome p {
                color: var(--muted);
                margin: 0.75rem auto 0;
                max-width: 32rem;
                line-height: 1.5;
            }
            .steps {
                list-style: none;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.5rem 1.5rem;
                margin-top: 1.75rem;
                font-size: 0.9rem;
                color: var(--muted);
            }
            .steps b {
                display: inline-grid;
                place-items: center;
                width: 1.4rem;
                height: 1.4rem;
                margin-right: 0.4rem;
                border-radius: 50%;
                background: var(--surface-2);
                color: var(--accent);
                font-size: 0.75rem;
            }

            /* --- Messages --- */
            #messages {
                display: flex;
                flex-direction: column;
                gap: 1.75rem;
                padding: 1.5rem 0;
            }
            .msg.user {
                align-self: flex-end;
                max-width: 80%;
                background: var(--surface-2);
                padding: 0.65rem 1rem;
                border-radius: 18px 18px 4px 18px;
                line-height: 1.5;
            }
            .msg.assistant {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                line-height: 1.6;
            }
            .plain strong {
                font-weight: 600;
            }
            .plain ul {
                margin: 0.4rem 0 0 1.2rem;
            }
            .error {
                color: var(--bad);
            }

            /* Cards slide up into place, one after another. */
            .rise {
                animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(12px) scale(0.98);
                }
            }

            /* --- Loading: bouncing basketball --- */
            .thinking {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                color: var(--muted);
                font-style: italic;
                min-height: 2rem;
            }
            .thinking .bounce {
                display: inline-block;
                font-size: 1.3rem;
                animation: bounce 0.6s cubic-bezier(0.5, 0, 0.5, 1) infinite alternate;
            }
            @keyframes bounce {
                from {
                    transform: translateY(-6px) rotate(0deg);
                }
                to {
                    transform: translateY(4px) rotate(90deg);
                }
            }
            .dots::after {
                content: "";
                animation: dots 1.2s steps(4) infinite;
            }
            @keyframes dots {
                0% {
                    content: "";
                }
                25% {
                    content: ".";
                }
                50% {
                    content: "..";
                }
                75% {
                    content: "...";
                }
            }

            /* --- Shared card look --- */
            .tile {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 1rem 1.1rem;
                box-shadow: var(--shadow);
                transition: transform 0.2s, border-color 0.2s;
            }
            .tile:hover {
                transform: translateY(-2px);
                border-color: #344055;
            }
            .eyebrow {
                font-size: 0.7rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            /* --- Take: hero card --- */
            .hero {
                position: relative;
                overflow: hidden;
                padding: 1.25rem 1.3rem 1.1rem;
                background:
                    radial-gradient(120% 140% at 100% 0%, rgba(255, 122, 26, 0.18), transparent 55%),
                    var(--surface);
            }
            .hero-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.75rem;
                flex-wrap: wrap;
            }
            .rating {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }
            .meter {
                display: flex;
                gap: 3px;
            }
            .meter span {
                width: 18px;
                height: 6px;
                border-radius: 3px;
                background: var(--line);
            }
            .meter span.on {
                background: var(--accent);
                box-shadow: 0 0 8px rgba(255, 122, 26, 0.6);
            }
            .rating-score {
                font-weight: 700;
                font-size: 0.85rem;
            }
            .rating-score small {
                color: var(--accent);
                font-weight: 600;
                margin-left: 0.3rem;
            }
            .source {
                font-size: 0.8rem;
                color: var(--muted);
                text-decoration: none;
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 0.25rem 0.65rem;
            }
            .source:hover {
                color: var(--text);
                border-color: var(--muted);
            }
            .take-text {
                font-size: clamp(1.25rem, 3.6vw, 1.6rem);
                font-weight: 600;
                line-height: 1.4;
                letter-spacing: -0.01em;
                margin: 0.9rem 0 0.8rem;
            }
            .original {
                font-size: 0.82rem;
                color: var(--muted);
                border-left: 2px solid var(--line);
                padding-left: 0.6rem;
            }

            /* --- Take: tiles under the hero --- */
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }
            .stat-big {
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                margin: 0.35rem 0 0.15rem;
            }
            .stat-big b {
                font-family: var(--display);
                font-weight: 400;
                font-size: 2.4rem;
                line-height: 1;
            }
            .stat-big span {
                color: var(--muted);
                font-weight: 600;
            }
            .delta {
                display: inline-block;
                font-size: 0.75rem;
                font-weight: 700;
                padding: 0.1rem 0.45rem;
                border-radius: 999px;
            }
            .delta.up {
                color: var(--good);
                background: rgba(61, 220, 151, 0.12);
            }
            .delta.down {
                color: var(--bad);
                background: rgba(255, 107, 125, 0.12);
            }
            .tile p {
                font-size: 0.9rem;
                margin-top: 0.45rem;
                color: #c9d1dc;
            }
            .tile .note {
                font-size: 0.78rem;
                color: var(--muted);
            }

            /* --- Argument: friend vs you exchange --- */
            .exchange {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }
            .bubble {
                max-width: 85%;
                padding: 0.7rem 0.95rem;
                border-radius: 16px;
                box-shadow: var(--shadow);
                font-size: 0.95rem;
            }
            .bubble .eyebrow {
                display: block;
                margin-bottom: 0.2rem;
            }
            .bubble.friend {
                align-self: flex-start;
                background: var(--surface-2);
                border-bottom-left-radius: 4px;
            }
            .bubble.you {
                align-self: flex-end;
                background: linear-gradient(135deg, rgba(255, 122, 26, 0.22), rgba(255, 122, 26, 0.1));
                border: 1px solid rgba(255, 122, 26, 0.35);
                border-bottom-right-radius: 4px;
            }
            .bubble.you .eyebrow {
                color: var(--accent);
            }

            /* --- Head-to-head stats --- */
            .h2h table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 0.6rem;
                font-variant-numeric: tabular-nums;
            }
            .h2h th {
                font-size: 0.85rem;
                font-weight: 600;
                padding-bottom: 0.4rem;
            }
            .h2h th small {
                display: block;
                font-weight: 400;
                color: var(--muted);
                font-size: 0.72rem;
            }
            .h2h td {
                padding: 0.4rem 0;
                border-top: 1px solid var(--line);
                text-align: center;
            }
            .h2h td.label {
                color: var(--muted);
                font-size: 0.75rem;
                font-weight: 600;
                width: 22%;
            }
            .h2h td.win {
                color: var(--good);
                font-weight: 700;
            }

            /* --- Reddit replies + copy --- */
            details {
                font-size: 0.88rem;
            }
            summary {
                cursor: pointer;
                color: var(--muted);
            }
            summary:hover {
                color: var(--text);
            }
            details h4 {
                margin-top: 0.7rem;
            }
            details ul {
                margin: 0.3rem 0 0 1.1rem;
            }
            details li {
                margin-bottom: 0.35rem;
                color: #c9d1dc;
            }
            .copy {
                align-self: flex-start;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.8rem;
            }
            .copy:hover {
                color: var(--text);
            }

            /* --- Composer --- */
            .composer {
                position: sticky;
                bottom: 0;
                margin-top: auto;
                padding: 0.75rem 0 1.25rem;
                background: linear-gradient(transparent, var(--bg) 25%);
            }
            .chips {
                display: flex;
                gap: 0.5rem;
                overflow-x: auto;
                padding-bottom: 0.6rem;
                scrollbar-width: none;
            }
            .chip {
                flex: none;
                background: var(--surface);
                border: 1px solid var(--line);
                color: var(--text);
                border-radius: 999px;
                padding: 0.45rem 0.85rem;
                font-size: 0.85rem;
            }
            .chip:hover {
                border-color: var(--accent);
            }
            .input-row {
                display: flex;
                gap: 0.5rem;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 0.35rem;
                box-shadow: var(--shadow);
            }
            .input-row:focus-within {
                border-color: var(--accent);
            }
            #user-input {
                flex: 1;
                min-width: 0;
                background: none;
                border: none;
                outline: none;
                color: var(--text);
                font: inherit;
                padding: 0.6rem 0.7rem;
            }
            #send-btn {
                background: var(--accent);
                color: #1a0d00;
                border: none;
                border-radius: 10px;
                padding: 0 1.1rem;
                font-weight: 700;
            }
            button:disabled {
                opacity: 0.4;
                cursor: wait;
            }

            @media (max-width: 600px) {
                .brand {
                    font-size: 1.1rem;
                }
                #welcome {
                    padding-top: 2rem;
                }
                .steps {
                    flex-direction: column;
                    align-items: center;
                }
                .grid {
                    grid-template-columns: 1fr;
                }
                .msg.user,
                .bubble {
                    max-width: 92%;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="bar">
                <div class="brand"><span>🏀</span>BALL KNOWLEDGE</div>
                <button id="new-chat">New chat</button>
            </div>
        </header>

        <main>
            <section id="welcome">
                <h1>Sound like you <span>watch every game.</span></h1>
                <p>
                    Friends into the NBA and you're not? Get a real, spicy take from Reddit fans, backed
                    by a real stat, plus what to say when they push back.
                </p>
                <ol class="steps">
                    <li><b>1</b>Ask for a take</li>
                    <li><b>2</b>Drop it in the group chat</li>
                    <li><b>3</b>Ask how to respond if they disagree</li>
                </ol>
            </section>

            <div id="messages"></div>

            <div class="composer">
                <div class="chips">
                    <button class="chip" data-prompt="Give me a niche take">Give me a niche take</button>
                    <button class="chip" data-prompt="Give me a niche take about Stephen Curry">
                        A take about Stephen Curry
                    </button>
                    <button class="chip" data-prompt="My friend says that's a terrible take, what do I say?">
                        My friend disagrees. What do I say?
                    </button>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="user-input"
                        placeholder="Ask for a take about any player or team…"
                        autocomplete="off"
                        maxlength="500"
                    />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>

        <script>
            const messages = document.getElementById("messages");
            const welcome = document.getElementById("welcome");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");

            // Each browser tab is its own session: sessionStorage is per-tab.
            let sessionId = sessionStorage.getItem("ballKnowledgeSession");

            // --- Small helpers ---

            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Plain text: remove markdown bold and escapes like "\#1".
            function clean(text) {
                return (text || "").replace(/\\([#*_\-])/g, "$1").replace(/\*\*/g, "").trim();
            }

            // For answers that aren't a take or an argument: escape, then allow **bold** and bullets.
            function renderPlain(text) {
                const lines = escapeHtml((text || "").replace(/\\([#*_\-])/g, "$1")).split("\n");
                let html = "";
                let inList = false;
                for (const line of lines) {
                    const bullet = line.match(/^\s*[-*]\s+(.*)/);
                    if (bullet && !inList) html += "<ul>";
                    if (!bullet && inList) html += "</ul>";
                    inList = Boolean(bullet);
                    html += bullet ? "<li>" + bullet[1] + "</li>" : line + "<br>";
                }
                if (inList) html += "</ul>";
                return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            }

            function parse(result) {
                try {
                    return JSON.parse(result);
                } catch {
                    return {};
                }
            }

            function scrollDown() {
                window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
            }

            // Add a card to a message with a staggered slide-up animation.
            function place(body, node) {
                node.classList.add("rise");
                node.style.animationDelay = body.children.length * 70 + "ms";
                body.appendChild(node);
                return node;
            }

            // --- Reading the model's answer ---

            // Split the answer into the lines before any label (intro), and "**Label:** text" parts.
            // Labels come from the system prompt: The take / The receipt / Spice / If they push back,
            // and They'll say / You say / Say this.
            function sections(text) {
                const intro = [];
                const parts = [];
                for (const raw of (text || "").split("\n")) {
                    const line = raw.replace(/^\s*[-*]\s+/, "").trim();
                    if (!line) continue;
                    const labelled = line.match(/^\*\*([^*]+?):?\*\*:?\s*(.*)$/);
                    if (labelled) parts.push({ label: labelled[1].toLowerCase(), text: labelled[2] });
                    else if (parts.length) parts[parts.length - 1].text += " " + line;
                    else intro.push(line);
                }
                return { intro: intro.join(" "), parts };
            }

            function partText(parts, label) {
                const part = parts.find((p) => p.label === label);
                return part ? clean(part.text) : "";
            }

            // --- Building blocks ---

            function ratingMeter(level, label) {
                const box = el("div", "rating");
                box.appendChild(el("span", "eyebrow", "Take rating"));
                const meter = el("div", "meter");
                for (let i = 1; i <= 5; i++) meter.appendChild(el("span", i <= level ? "on" : ""));
                box.appendChild(meter);
                const score = el("span", "rating-score", level + "/5");
                if (label) score.appendChild(el("small", "", label));
                box.appendChild(score);
                return box;
            }

            function heroCard(takeText, take) {
                const card = el("div", "tile hero");
                const top = el("div", "hero-top");
                top.appendChild(ratingMeter(take.spice, take.spice_label));
                const link = el("a", "source", "r/" + take.subreddit + " ↗");
                link.href = take.url;
                link.target = "_blank";
                link.rel = "noopener";
                top.appendChild(link);
                card.appendChild(top);
                // The credit lives on the source link, so drop "via r/..." from the big text.
                card.appendChild(el("p", "take-text", takeText.replace(/[,(\s]*via r\/\w+\)?\.?$/i, ".")));
                card.appendChild(el("p", "original", "Original post: “" + take.title + "”"));
                return card;
            }

            function receiptTile(stats, receiptText) {
                const tile = el("div", "tile");
                tile.appendChild(el("span", "eyebrow", "The receipt"));
                const swing = stats && stats.biggest_swings && stats.biggest_swings[0];
                if (swing) {
                    const big = el("div", "stat-big");
                    big.appendChild(el("b", "", swing.season));
                    big.appendChild(el("span", "", swing.stat));
                    const up = swing.change_pct >= 0;
                    big.appendChild(el("span", "delta " + (up ? "up" : "down"), (up ? "▲ " : "▼ ") + Math.abs(swing.change_pct) + "%"));
                    tile.appendChild(big);
                    tile.appendChild(el("span", "note", "vs " + swing.career + " career avg · " + stats.season.replace(" regular season", "")));
                }
                if (receiptText) tile.appendChild(el("p", "", receiptText));
                return tile;
            }

            function textTile(eyebrow, text) {
                const tile = el("div", "tile");
                tile.appendChild(el("span", "eyebrow", eyebrow));
                tile.appendChild(el("p", "", text));
                return tile;
            }

            function bubble(who, text) {
                const node = el("div", "bubble " + who);
                node.appendChild(el("span", "eyebrow", who === "friend" ? "Your friend" : "You"));
                node.appendChild(document.createTextNode(text));
                return node;
            }

            // Side-by-side stats for two (or more) players; the better number in each row is green.
            function headToHead(players) {
                const tile = el("div", "tile h2h");
                tile.appendChild(el("span", "eyebrow", "Head to head"));
                const table = el("table");
                const head = el("tr");
                head.appendChild(el("th"));
                for (const p of players) {
                    const th = el("th", "", p.player);
                    th.appendChild(el("small", "", p.season.replace(" regular season", "")));
                    head.appendChild(th);
                }
                table.appendChild(head);
                for (const stat of ["PTS", "REB", "AST", "FG%", "3P%", "FT%"]) {
                    const values = players.map((p) => p.season_averages[stat]);
                    const best = Math.max(...values.filter((v) => v !== undefined));
                    const row = el("tr");
                    row.appendChild(el("td", "label", stat));
                    for (const v of values) row.appendChild(el("td", v === best ? "win" : "", v === undefined ? "–" : v));
                    table.appendChild(row);
                }
                tile.appendChild(table);
                return tile;
            }

            // The real Reddit replies behind a pushback answer, collapsed by default.
            function redditReplies(data) {
                const box = el("details", "tile");
                box.appendChild(el("summary", "", "See what Redditors actually said"));
                const lists = [
                    ["Arguments against it", data.counterarguments],
                    ["How the original poster defended it", data.op_defenses],
                ];
                for (const [heading, items] of lists) {
                    if (!items || !items.length) continue;
                    box.appendChild(el("h4", "eyebrow", heading));
                    const ul = el("ul");
                    for (const item of items) ul.appendChild(el("li", "", item.text));
                    box.appendChild(ul);
                }
                return box;
            }

            function copyButton(text) {
                const copy = el("button", "copy", "Copy take");
                copy.addEventListener("click", async () => {
                    try {
                        await navigator.clipboard.writeText(text);
                        copy.textContent = "✓ Copied";
                    } catch {
                        copy.textContent = "Couldn't copy";
                    }
                    setTimeout(() => (copy.textContent = "Copy take"), 1500);
                });
                return copy;
            }

            // --- Filling an assistant message ---

            function fillAssistant(body, data) {
                body.innerHTML = "";

                // Tool results (the raw calls stay out of the UI).
                const calls = data.tool_calls || [];
                const results = (name) =>
                    calls.filter((c) => c.name === name).map((c) => parse(c.result)).filter((r) => !r.error);
                const take = results("find_hot_takes").map((r) => r.takes && r.takes[0]).find(Boolean);
                const stats = results("get_stat_receipts");
                const pushback = results("prep_for_pushback")[0];

                const { intro, parts } = sections(data.response);
                const takeText = partText(parts, "the take");

                if (takeText && take) {
                    // A take: big hero card, then the receipt and comeback side by side.
                    if (intro) place(body, el("p", "", clean(intro)));
                    place(body, heroCard(takeText, take));
                    const grid = el("div", "grid");
                    grid.appendChild(receiptTile(stats[0], partText(parts, "the receipt")));
                    grid.appendChild(textTile("If they push back", partText(parts, "if they push back")));
                    place(body, grid);
                    place(body, copyButton(takeText));
                } else if (parts.some((p) => ["they'll say", "you say", "say this"].includes(p.label))) {
                    // An argument: a back-and-forth between your friend and you.
                    if (intro) place(body, el("p", "", clean(intro)));
                    const exchange = el("div", "exchange");
                    for (const part of parts) {
                        if (part.label === "they'll say") exchange.appendChild(bubble("friend", clean(part.text)));
                        else exchange.appendChild(bubble("you", clean(part.text)));
                    }
                    place(body, exchange);
                    if (stats.length >= 2) place(body, headToHead(stats));
                    if (pushback) place(body, redditReplies(pushback));
                } else {
                    // Anything else (greetings, errors, off-topic): plain text.
                    const text = el("div", "plain");
                    text.innerHTML = renderPlain(data.response);
                    place(body, text);
                    if (stats.length >= 2) place(body, headToHead(stats));
                    if (pushback) place(body, redditReplies(pushback));
                }
            }

            // --- Sending ---

            function addAssistant() {
                const body = el("div", "msg assistant");
                const thinking = el("div", "thinking");
                thinking.appendChild(el("span", "bounce", "🏀"));
                thinking.appendChild(el("span", "dots", "Generating original thoughts"));
                body.appendChild(thinking);
                messages.appendChild(body);
                return body;
            }

            async function send(text) {
                text = (text || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                welcome.hidden = true;
                userInput.value = "";
                sendBtn.disabled = true;
                messages.appendChild(el("div", "msg user", text));
                const body = addAssistant();
                scrollDown();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });
                    if (!res.ok) throw new Error("Server said " + res.status);
                    const data = await res.json();
                    sessionId = data.session_id;
                    sessionStorage.setItem("ballKnowledgeSession", sessionId);
                    fillAssistant(body, data);
                } catch (e) {
                    body.innerHTML = "";
                    body.appendChild(
                        el(
                            "p",
                            "error",
                            "Couldn't reach Ball Knowledge (" + e.message + "). Check your connection and try again.",
                        ),
                    );
                }
                sendBtn.disabled = false;
                userInput.focus();
                scrollDown();
            }

            function newChat() {
                if (sessionId) {
                    fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" }).catch(() => {});
                }
                sessionId = null;
                sessionStorage.removeItem("ballKnowledgeSession");
                messages.innerHTML = "";
                welcome.hidden = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") send();
            });
            document.querySelectorAll(".chip").forEach((chip) =>
                chip.addEventListener("click", () => send(chip.dataset.prompt)),
            );
            document.getElementById("new-chat").addEventListener("click", newChat);
            userInput.focus();
        </script>
    </body>
</html>
