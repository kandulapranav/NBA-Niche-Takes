<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ball Knowledge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                color-scheme: dark; /* dark native scrollbars and form controls */
                --space: #07080f;
                --window: rgba(14, 17, 26, 0.45);
                --surface: rgba(255, 255, 255, 0.06);
                --edge: rgba(255, 255, 255, 0.1);
                --canvas: rgba(255, 255, 255, 0.04);
                --gray: rgba(255, 255, 255, 0.09);
                --text: #e9edf3;
                --soft-text: #b8c0cc;
                --muted: #8b95a5;
                --orange: #f26a1b;
                --orange-2: #ff9a3c;
                --gradient: linear-gradient(135deg, #ff9a3c 0%, #f26a1b 55%, #e2471c 100%);
                --good: #12a26b;
                --bad: #d6334a;
                --soft-shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7);
                --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--space);
                color: var(--text);
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }
            button {
                font: inherit;
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
            }

            /* --- Starfield behind the chat window --- */
            .stars,
            .stars::after {
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background-image:
                    radial-gradient(1px 1px at 25px 35px, #fff, transparent),
                    radial-gradient(1px 1px at 140px 80px, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 90px 160px, #fff, transparent),
                    radial-gradient(1px 1px at 200px 220px, #fff, transparent),
                    radial-gradient(1px 1px at 260px 60px, #fff, transparent);
                background-size: 300px 260px;
                opacity: 0.45;
                animation: twinkle 5s ease-in-out infinite alternate;
            }
            .stars::after {
                content: "";
                background-size: 410px 370px;
                background-position: 120px 90px;
                animation-delay: -2.5s;
            }
            @keyframes twinkle {
                to {
                    opacity: 0.15;
                }
            }
            .shooting-star {
                position: fixed;
                top: 12%;
                left: 78%;
                z-index: -1;
                width: 90px;
                height: 1px;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), transparent);
                opacity: 0;
                animation: shoot 9s ease-out infinite 2s;
            }
            @keyframes shoot {
                0% {
                    opacity: 0;
                    transform: rotate(-20deg) translateX(0);
                }
                3% {
                    opacity: 1;
                }
                10%,
                100% {
                    opacity: 0;
                    transform: rotate(-20deg) translateX(-260px);
                }
            }

            /* --- The basketball (used for the big orb and the small avatars) --- */
            .ball {
                position: relative;
                flex: none;
                width: var(--size, 32px);
                height: var(--size, 32px);
                border-radius: 50%;
                overflow: hidden;
                background: radial-gradient(circle at 34% 28%, #ffb27a 0%, #f26a1b 38%, #b8470b 72%, #5c2104 100%);
                box-shadow: inset calc(var(--size, 32px) * -0.1) calc(var(--size, 32px) * -0.13) calc(var(--size, 32px) * 0.22)
                    rgba(0, 0, 0, 0.45);
            }
            .ball svg {
                width: 100%;
                height: 100%;
                animation: spin 14s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* --- Layout: one chat window floating in space --- */
            .app {
                height: 100%;
                max-width: 760px;
                margin: 0 auto;
                padding: 1.25rem 1rem 0.5rem;
                display: flex;
                flex-direction: column;
            }
            .window {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--window);
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                border: 1px solid var(--edge);
                border-radius: 22px;
                /* clip, not hidden: the closed sheet sits below the window, and a "hidden"
                   box can still be scrolled by the browser (e.g. when focus moves). */
                overflow: clip;
                box-shadow:
                    0 30px 80px -20px rgba(0, 0, 0, 0.7),
                    0 0 0 1px rgba(255, 255, 255, 0.06);
            }
            .footnote {
                text-align: center;
                padding: 0.6rem 0 0.2rem;
                font-family: var(--mono);
                font-size: 0.64rem;
                letter-spacing: 0.08em;
                color: rgba(255, 255, 255, 0.4);
            }

            /* --- Window header (gradient bar) --- */
            .win-head {
                position: relative;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.85rem 1rem;
                border-bottom: 1px solid var(--edge);
                color: #fff;
            }
            .avatar-wrap {
                position: relative;
            }
            .online {
                position: absolute;
                right: -1px;
                bottom: -1px;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: #3ddc97;
                border: 2px solid #0e111a;
            }
            .win-head .who {
                flex: 1;
                line-height: 1.25;
            }
            .win-head .who b {
                display: block;
                font-size: 1rem;
            }
            .win-head .who span {
                font-size: 0.78rem;
                opacity: 0.85;
            }
            .icon-btn {
                width: 2.2rem;
                height: 2.2rem;
                border-radius: 50%;
                font-size: 1.2rem;
                line-height: 1;
            }
            .win-head .icon-btn:hover {
                background: var(--gray);
            }
            .menu {
                position: absolute;
                top: 3.4rem;
                right: 0.9rem;
                z-index: 5;
                background: rgba(22, 26, 37, 0.97);
                border: 1px solid var(--edge);
                color: var(--text);
                border-radius: 12px;
                box-shadow: var(--soft-shadow);
                padding: 0.35rem;
                min-width: 11rem;
            }
            .menu[hidden] {
                display: none;
            }
            .menu button {
                display: flex;
                gap: 0.6rem;
                width: 100%;
                padding: 0.55rem 0.7rem;
                border-radius: 8px;
                font-size: 0.88rem;
                text-align: left;
            }
            .menu button:hover {
                background: var(--canvas);
            }

            /* --- Scrolling conversation area --- */
            #scroll {
                flex: 1;
                overflow-y: auto;
                padding: 1.25rem 1rem 1.5rem;
            }

            /* Welcome: floating orb + greeting + quick takes */
            #welcome {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 1.25rem 0 0.5rem;
            }
            #welcome[hidden] {
                display: none;
            }
            .orb {
                position: relative;
                margin-bottom: 1.4rem;
                animation: float 5s ease-in-out infinite;
            }
            /* Pulsing ring around the orb, like a bot that's listening. */
            .orb::before,
            .orb::after {
                content: "";
                position: absolute;
                inset: -10px;
                border-radius: 50%;
                border: 2px solid rgba(242, 106, 27, 0.45);
                animation: pulse 2.6s ease-out infinite;
            }
            .orb::after {
                animation-delay: 1.3s;
            }
            @keyframes pulse {
                from {
                    transform: scale(0.9);
                    opacity: 1;
                }
                to {
                    transform: scale(1.35);
                    opacity: 0;
                }
            }
            @keyframes float {
                50% {
                    transform: translateY(-10px);
                }
            }
            #welcome h1 {
                font-size: clamp(1.5rem, 5vw, 1.9rem);
                font-weight: 800;
                letter-spacing: -0.03em;
            }
            #welcome p {
                margin-top: 0.5rem;
                max-width: 28rem;
                color: var(--muted);
                line-height: 1.5;
                font-size: 0.95rem;
            }

            /* A list card of options (welcome screen and bottom sheet). */
            .options {
                width: 100%;
                max-width: 420px;
                margin-top: 1.4rem;
                background: var(--surface);
                border: 1px solid var(--edge);
                border-radius: 16px;
                box-shadow: var(--soft-shadow);
                padding: 0.9rem 1rem 0.4rem;
                text-align: left;
            }
            .options-title {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-weight: 700;
                font-size: 0.95rem;
                padding-bottom: 0.4rem;
            }
            .options button {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                width: 100%;
                padding: 0.75rem 0.1rem;
                border-top: 1px solid var(--gray);
                font-size: 0.9rem;
                color: var(--soft-text);
                text-align: left;
            }
            .options button[hidden] {
                display: none;
            }
            .options button::before {
                content: "";
                flex: none;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--orange);
            }
            .options button:hover {
                color: var(--text);
            }

            /* --- Messages --- */
            #messages {
                display: flex;
                flex-direction: column;
                gap: 1.1rem;
            }
            .row {
                display: flex;
                align-items: flex-end;
                gap: 0.55rem;
            }
            .row.user {
                justify-content: flex-end;
            }
            .stack {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                min-width: 0;
                max-width: 88%;
            }
            .bubble {
                position: relative;
                padding: 0.7rem 0.95rem 0.5rem;
                border-radius: 18px;
                line-height: 1.5;
                font-size: 0.94rem;
                overflow-wrap: anywhere;
            }
            .bubble.bot {
                align-self: flex-start;
                background: var(--surface);
                border: 1px solid var(--edge);
                border-bottom-left-radius: 5px;
                box-shadow: 0 2px 8px -4px rgba(0, 0, 0, 0.5);
            }
            .bubble.me {
                background: var(--gradient);
                color: #fff;
                border-bottom-right-radius: 5px;
                box-shadow: 0 10px 24px -12px rgba(242, 106, 27, 0.8);
            }
            .time {
                display: block;
                margin-top: 0.2rem;
                text-align: right;
                font-size: 0.68rem;
                color: var(--muted);
            }
            .bubble.me .time {
                color: rgba(255, 255, 255, 0.75);
            }
            .bubble ul {
                margin: 0.3rem 0 0 1.1rem;
            }
            .error {
                color: var(--bad);
            }
            .eyebrow {
                display: block;
                font-family: var(--mono);
                font-size: 0.64rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
            }

            /* Things pop into place one after another. */
            .rise {
                animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px) scale(0.98);
                }
            }

            /* Loading: a player hits a jump shot, on a loop (all parts share one 2s timeline). */
            .typing {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.2rem;
            }
            .court {
                width: 100px;
                height: 60px;
                opacity: 0.45; /* faded, so it sits in the background */
                overflow: visible;
            }
            /* In SVG, transform-origin is measured in the drawing's own units. */
            .court * {
                transform-box: view-box;
            }
            .shooter {
                animation: jump 2s cubic-bezier(0.45, 0, 0.25, 1) infinite;
            }
            .ball-in-hand {
                animation: in-hand 2s step-end infinite;
            }
            .flying-ball {
                /* The ball follows this arc from the shooter's hands, through the rim, down the net. */
                offset-path: path("M48 45 Q108 -18 167 43 L168 70");
                offset-rotate: auto;
                animation: flight 2s linear infinite;
            }
            .net {
                transform-origin: 167px 44px; /* top of the net */
                animation: swish 2s ease-out infinite;
            }
            .plus-two {
                animation: score 2s ease-out infinite;
            }
            @keyframes jump {
                0%,
                45%,
                100% {
                    transform: translateY(0);
                }
                12% {
                    transform: translateY(3px); /* crouch */
                }
                25% {
                    transform: translateY(-10px); /* top of the jump: release */
                }
                32% {
                    transform: translateY(-8px); /* hang time */
                }
            }
            @keyframes in-hand {
                0% {
                    opacity: 1;
                }
                25% {
                    opacity: 0; /* released */
                }
                97% {
                    opacity: 1;
                }
            }
            @keyframes flight {
                0%,
                25% {
                    offset-distance: 0%;
                    opacity: 0;
                }
                26% {
                    opacity: 1;
                }
                80% {
                    offset-distance: 100%;
                    opacity: 1;
                }
                86%,
                100% {
                    offset-distance: 100%;
                    opacity: 0;
                }
            }
            @keyframes swish {
                0%,
                68%,
                90%,
                100% {
                    transform: scale(1, 1);
                }
                76% {
                    transform: scale(0.85, 1.3);
                }
            }
            @keyframes score {
                0%,
                74% {
                    opacity: 0;
                    transform: translateY(4px);
                }
                80%,
                92% {
                    opacity: 1;
                    transform: translateY(-4px);
                }
                100% {
                    opacity: 0;
                    transform: translateY(-8px);
                }
            }
            .typing small {
                font-size: 0.78rem;
                color: var(--muted);
                font-style: italic;
            }

            /* --- Take: card, link preview, receipt block --- */
            .card {
                background: var(--surface);
                border: 1px solid var(--edge);
                border-radius: 18px;
                padding: 1rem 1.1rem;
                box-shadow: var(--soft-shadow);
            }
            .take-text {
                font-size: clamp(1.15rem, 3.4vw, 1.4rem);
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.35;
            }
            .preview {
                display: flex;
                gap: 0.75rem;
                align-items: center;
                margin-top: 0.9rem;
                padding: 0.6rem;
                border-radius: 12px;
                background: var(--canvas);
                color: inherit;
                text-decoration: none;
            }
            .preview:hover {
                background: var(--gray);
            }
            .preview .thumb {
                flex: none;
                width: 2.6rem;
                height: 2.6rem;
                border-radius: 10px;
                display: grid;
                place-items: center;
                background: #ff4500;
                color: #fff;
                font-weight: 800;
                font-size: 0.8rem;
            }
            .preview b {
                display: block;
                font-size: 0.86rem;
                text-decoration: underline;
                text-underline-offset: 2px;
            }
            .preview span {
                font-size: 0.75rem;
                color: var(--muted);
            }

            /* The receipt: a bold split block */
            .receipt {
                display: grid;
                grid-template-columns: 1fr 1fr;
                border-radius: 16px;
                overflow: hidden;
                background: var(--gradient);
                color: #fff;
                box-shadow: 0 14px 30px -14px rgba(242, 106, 27, 0.9);
            }
            .receipt > div {
                padding: 0.9rem 1rem;
            }
            .receipt > div + div {
                border-left: 1px solid rgba(255, 255, 255, 0.35);
            }
            .receipt .eyebrow {
                color: rgba(255, 255, 255, 0.8);
            }
            .receipt .big {
                font-size: 2.1rem;
                font-weight: 800;
                letter-spacing: -0.04em;
                line-height: 1.1;
                margin-top: 0.2rem;
            }
            .receipt .big small {
                font-size: 0.85rem;
                font-weight: 700;
                letter-spacing: 0;
                margin-left: 0.3rem;
            }
            .receipt p {
                font-size: 0.78rem;
                opacity: 0.9;
            }
            .receipt-note {
                font-size: 0.85rem;
                color: var(--soft-text);
                padding: 0 0.3rem;
            }
            .label {
                font-weight: 700;
                margin-right: 0.25rem;
            }

            /* --- Argument: your friend vs you --- */
            .exchange {
                display: flex;
                flex-direction: column;
                gap: 0.55rem;
                margin-top: 0.6rem;
            }
            .say {
                max-width: 88%;
                padding: 0.6rem 0.85rem;
                border-radius: 14px;
                font-size: 0.9rem;
                line-height: 1.45;
            }
            .say .eyebrow {
                margin-bottom: 0.15rem;
            }
            .say.friend {
                align-self: flex-start;
                background: var(--canvas);
                border-bottom-left-radius: 4px;
            }
            .say.you {
                align-self: flex-end;
                background: rgba(242, 106, 27, 0.1);
                border: 1.5px solid rgba(242, 106, 27, 0.45);
                border-bottom-right-radius: 4px;
            }
            .say.you .eyebrow {
                color: var(--orange);
            }

            /* Player profile ("who is this?") */
            .profile-top {
                display: flex;
                align-items: center;
                gap: 0.9rem;
            }
            .profile-top .headshot {
                width: 4.2rem;
                height: 4.2rem;
                box-shadow:
                    0 0 0 3px #0e111a,
                    0 0 0 5px var(--orange);
            }
            .profile-top b {
                display: block;
                font-size: 1.2rem;
                letter-spacing: -0.02em;
            }
            .profile-top span {
                font-size: 0.85rem;
                color: var(--soft-text);
            }
            .facts {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0.5rem;
                margin-top: 0.9rem;
            }
            .fact {
                background: var(--canvas);
                border: 1px solid var(--edge);
                border-radius: 12px;
                padding: 0.55rem 0.65rem;
            }
            .fact b {
                display: block;
                font-size: 0.95rem;
                margin-top: 0.15rem;
            }
            .awards {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-top: 0.8rem;
            }
            .award {
                padding: 0.25rem 0.65rem;
                border-radius: 999px;
                background: rgba(242, 106, 27, 0.14);
                border: 1px solid rgba(242, 106, 27, 0.35);
                color: #ffb27a;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .profile-foot {
                margin-top: 0.7rem;
                font-size: 0.8rem;
                color: var(--muted);
            }

            /* Head-to-head stats */
            .h2h table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 0.5rem;
                font-variant-numeric: tabular-nums;
                font-size: 0.9rem;
            }
            .h2h th {
                padding-bottom: 0.5rem;
                font-size: 0.85rem;
            }
            .h2h th img {
                display: block;
                width: 54px;
                height: 40px;
                object-fit: cover;
                margin: 0 auto 0.25rem;
            }
            .h2h th small {
                display: block;
                font-weight: 400;
                color: var(--muted);
                font-size: 0.7rem;
            }
            .h2h td {
                padding: 0.45rem 0;
                border-top: 1px solid var(--gray);
                text-align: center;
            }
            .h2h td.stat {
                font-family: var(--mono);
                font-size: 0.68rem;
                font-weight: 700;
                color: var(--muted);
                width: 20%;
            }
            .h2h td.win span {
                padding: 0.1rem 0.5rem;
                border-radius: 999px;
                background: rgba(242, 106, 27, 0.16);
                color: var(--orange);
                font-weight: 800;
            }

            /* Reddit replies (collapsed) */
            details summary {
                cursor: pointer;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--soft-text);
            }
            details .eyebrow {
                margin-top: 0.8rem;
            }
            details ul {
                margin: 0.3rem 0 0 1.1rem;
                font-size: 0.86rem;
                color: var(--soft-text);
            }
            details li {
                margin-bottom: 0.35rem;
            }

            .actions {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                flex-wrap: wrap;
                padding-left: 0.2rem;
            }
            .pill {
                padding: 0.35rem 0.8rem;
                border-radius: 999px;
                background: var(--surface);
                border: 1px solid var(--edge);
                box-shadow: 0 2px 8px -4px rgba(0, 0, 0, 0.5);
                font-size: 0.78rem;
                font-weight: 600;
            }
            .pill:hover {
                color: var(--orange);
            }
            .tools-used {
                font-family: var(--mono);
                font-size: 0.62rem;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            /* --- Composer --- */
            .composer {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.7rem 0.8rem;
                border-top: 1px solid var(--edge);
            }
            #menu-btn {
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 50%;
                background: var(--canvas);
                color: var(--orange);
                font-size: 1.15rem;
            }
            #menu-btn:hover {
                background: var(--gray);
            }
            #user-input {
                flex: 1;
                min-width: 0;
                border: none;
                outline: none;
                background: transparent;
                font: inherit;
                font-size: 0.95rem;
                color: var(--text);
                padding: 0.55rem 0.3rem;
            }
            #send-btn {
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 50%;
                background: var(--gradient);
                color: #fff;
                font-size: 1.05rem;
                box-shadow: 0 8px 18px -8px rgba(242, 106, 27, 0.9);
            }
            button:disabled {
                opacity: 0.4;
                cursor: wait;
            }

            /* --- Bottom sheet: pick a player --- */
            .scrim {
                position: absolute;
                inset: 0;
                z-index: 6;
                background: rgba(0, 0, 0, 0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s;
            }
            .sheet {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 7;
                background: rgba(16, 19, 29, 0.97);
                border-top: 1px solid var(--edge);
                border-radius: 22px 22px 0 0;
                padding: 1.3rem 1rem 1.1rem;

            }

                opacity: 1;
                pointer-events: auto;
            }
            .window.sheet-open .sheet {
                transform: translateY(0);
            }
            .sheet-close {
                position: absolute;
                top: -1.3rem;
                right: 1.1rem;
                width: 2.6rem;
                height: 2.6rem;
                border-radius: 50%;

            }
            .sheet h2 {

            }
            .carousel {
                display: flex;
                gap: 0.5rem;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                padding: 1rem 40%;

            .player {
                flex: none;

                display: flex;
                flex-direction: column;
                align-items: center;
                width: 4.2rem;

            }
            .player.on {

            .headshot {
                position: relative;
                width: 3.6rem;
                height: 3.6rem;
                border-radius: 50%;
                overflow: hidden;
                background: var(--gray);
                display: grid;
                place-items: center;

                color: var(--muted);

            .headshot img {

            .picked {

            }
        </style>

        <script>
            const scroller = document.getElementById("scroll");
            const messages = document.getElementById("messages");
            const welcome = document.getElementById("welcome");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const windowEl = document.getElementById("window");

            // Each browser tab is its own session: sessionStorage is per-tab.
            let sessionId = sessionStorage.getItem("ballKnowledgeSession");

            // Friendly names for the tools, shown in a small line under each answer.
            const TOOL_LABELS = {
                find_hot_takes: "REDDIT TAKES",
                get_stat_receipts: "ESPN STATS",
                prep_for_pushback: "REDDIT REPLIES",
                get_player_profile: "ESPN PROFILE",
            };

            // Players for the carousel. The number is ESPN's athlete id, used for the headshot.
            const PLAYERS = [
                ["Stephen Curry", 3975],
                ["LeBron James", 1966],
                ["Victor Wembanyama", 5104157],
                ["Nikola Jokic", 3112335],
                ["Shai Gilgeous-Alexander", 4278073],
                ["Luka Doncic", 3945274],
                ["Giannis Antetokounmpo", 3032977],
                ["Anthony Edwards", 4594268],
                ["Jayson Tatum", 4065648],
                ["Jalen Brunson", 3934672],
                ["Kevin Durant", 3202],
                ["Kyrie Irving", 6442],
                ["Damian Lillard", 6606],
            ];

            // --- Small helpers ---

            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            function ball(size) {
                const node = document.getElementById("ball-template").content.firstElementChild.cloneNode(true);
                node.style.setProperty("--size", size + "px");
                return node;
            }

            function headshotUrl(id) {
                return "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/" + id + ".png&w=160&h=116";
            }

            function now() {
                return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Plain text: remove markdown bold/italics (**x**, *x*) and escapes like "\#1".
            function clean(text) {
                return (text || "")
                    .replace(/\\([#*_\-])/g, "$1")
                    .replace(/\*\*/g, "")
                    .replace(/\*(\S[^*]*?)\*/g, "$1")
                    .trim();
            }

            // For answers that aren't a take or an argument: escape, then allow **bold** and bullets.
            function renderPlain(text) {
                const lines = escapeHtml((text || "").replace(/\\([#*_\-])/g, "$1")).split("\n");
                let html = "";
                let inList = false;
                for (const line of lines) {
                    const bullet = line.match(/^\s*[-*]\s+(.*)/);
                    if (bullet && !inList) html += "<ul>";
                    if (!bullet && inList) html += "</ul>";
                    inList = Boolean(bullet);
                    html += bullet ? "<li>" + bullet[1] + "</li>" : line + "<br>";
                }
                if (inList) html += "</ul>";
                return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(<br>)+$/, "");
            }

            function parse(result) {
                try {
                    return JSON.parse(result);
                } catch {
                    return {};
                }
            }

            function scrollDown() {
                scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
            }

            // Add a block with a staggered pop-in animation.
            function place(stack, node) {
                node.classList.add("rise");
                node.style.animationDelay = stack.children.length * 80 + "ms";
                stack.appendChild(node);
                return node;
            }

            // --- Reading the model's answer ---

            // Split the answer into the lines before any label (intro), and "**Label:** text" parts.
            // Labels come from the system prompt: The take / The receipt / Spice / If they push back,
            // and They'll say / You say / Say this.
            function sections(text) {
                const intro = [];
                const parts = [];
                for (const raw of (text || "").split("\n")) {
                    const line = raw.replace(/^\s*[-*]\s+/, "").trim();
                    if (!line) continue;
                    const labelled = line.match(/^\*\*([^*]+?):?\*\*:?\s*(.*)$/);
                    // Lowercase, and turn curly apostrophes (They’ll) into straight ones (They'll).
                    const label = labelled && labelled[1].toLowerCase().replace(/[‘’]/g, "'");
                    if (labelled) parts.push({ label, text: labelled[2] });
                    else if (parts.length) parts[parts.length - 1].text += " " + line;
                    else intro.push(line);
                }
                return { intro: intro.join(" "), parts };
            }

            function partText(parts, label) {
                const part = parts.find((p) => p.label === label);
                return part ? clean(part.text) : "";
            }

            // --- Building blocks ---

            function botBubble(text, withTime) {
                const node = el("div", "bubble bot", text);
                if (withTime) node.appendChild(el("span", "time", now()));
                return node;
            }

            function takeCard(takeText, take) {
                const card = el("div", "card");
                // The credit is in the link preview, so drop "via r/..." from the big text.
                card.appendChild(el("p", "take-text", takeText.replace(/[,(\s]*via r\/\w+\)?\.?$/i, ".")));

                // Link preview of the original Reddit post.
                const preview = el("a", "preview");
                preview.href = take.url;
                preview.target = "_blank";
                preview.rel = "noopener";
                preview.appendChild(el("div", "thumb", "r/"));
                const info = el("div");
                info.appendChild(el("b", "", take.title));
                info.appendChild(el("span", "", "r/" + take.subreddit + " · " + take.num_comments + " comments"));
                preview.appendChild(info);
                card.appendChild(preview);
                return card;
            }

            // The receipt as a bold split block: the number on the left, the change on the right.
            function receiptBlock(stats) {
                const swing = stats && stats.biggest_swings && stats.biggest_swings[0];
                if (!swing) return null;
                const block = el("div", "receipt");
                const left = el("div");
                left.appendChild(el("span", "eyebrow", stats.season.replace(" regular season", "")));
                const big = el("div", "big", swing.season);
                big.appendChild(el("small", "", swing.stat));
                left.appendChild(big);
                left.appendChild(el("p", "", stats.player));
                const right = el("div");
                right.appendChild(el("span", "eyebrow", "vs career"));
                const up = swing.change_pct >= 0;
                right.appendChild(el("div", "big", (up ? "▲" : "▼") + Math.abs(swing.change_pct) + "%"));
                right.appendChild(el("p", "", "career avg " + swing.career));
                block.appendChild(left);
                block.appendChild(right);
                return block;
            }

            function labelled(label, text) {
                const node = el("div", "bubble bot");
                node.appendChild(el("span", "label", label));
                node.appendChild(document.createTextNode(text));
                return node;
            }

            // Backup when the model doesn't name a take id: the returned post sharing the most
            // words (4+ letters) with the take text.
            function closestTake(takes, text) {
                const words = new Set((text || "").toLowerCase().match(/[a-z]{4,}/g) || []);
                const overlap = (t) =>
                    ((t.title + " " + t.body_preview).toLowerCase().match(/[a-z]{4,}/g) || []).filter((w) => words.has(w))
                        .length;
                return takes.reduce((best, t) => (overlap(t) > overlap(best) ? t : best), takes[0]);
            }

            // "They'll say "..." → you say "..."" as a friend bubble and a you bubble.
            // Falls back to a plain labelled bubble if the model used a different shape.
            function pushbackCard(text) {
                const match = text.replace(/[‘’]/g, "'").match(/they'll say:?\s*["“](.+?)["”]\s*(?:→|->)?\s*you say:?\s*["“](.+)["”]\.?$/i);
                if (!match) return labelled("If they push back:", text);
                const card = el("div", "card");
                card.appendChild(el("span", "eyebrow", "If they push back"));
                const exchange = el("div", "exchange");
                for (const [who, line] of [["friend", match[1]], ["you", match[2]]]) {
                    const say = el("div", "say " + who);
                    say.appendChild(el("span", "eyebrow", who === "friend" ? "Your friend" : "You say"));
                    say.appendChild(document.createTextNode(line));
                    exchange.appendChild(say);
                }
                card.appendChild(exchange);
                return card;
            }

            function argumentCard(parts) {
                const card = el("div", "card");
                card.appendChild(el("span", "eyebrow", "How to argue it"));
                const exchange = el("div", "exchange");
                for (const part of parts) {
                    const friend = part.label === "they'll say";
                    const say = el("div", "say " + (friend ? "friend" : "you"));
                    say.appendChild(el("span", "eyebrow", friend ? "Your friend" : "You say"));
                    say.appendChild(document.createTextNode(clean(part.text)));
                    exchange.appendChild(say);
                }
                card.appendChild(exchange);
                return card;
            }

            // "Who is this player?": headshot, quick facts, and top awards.
            function profileCard(p) {
                const card = el("div", "card");
                const top = el("div", "profile-top");
                const shot = el("div", "headshot", p.player.split(" ").map((w) => w[0]).join(""));
                if (p.headshot) {
                    const img = el("img");
                    img.src = p.headshot;
                    img.alt = "";
                    img.onerror = () => img.remove(); // fall back to initials
                    shot.appendChild(img);
                }
                top.appendChild(shot);
                const who = el("div");
                who.appendChild(el("b", "", p.player));
                who.appendChild(el("span", "", [p.position, p.jersey, p.team].filter(Boolean).join(" · ")));
                top.appendChild(who);
                card.appendChild(top);

                // "2023: Rd 1, Pk 1 (SA)" reads better as "Pick 1 · 2023".
                const draft = (p.draft || "").match(/(\d{4}): Rd \d+, Pk (\d+)/);
                const facts = el("div", "facts");
                for (const [label, value] of [
                    ["Age", p.age],
                    ["Height", p.height],
                    ["In the league", p.experience],
                    ["Draft", draft ? "Pick " + draft[2] + " · " + draft[1] : p.draft],
                ]) {
                    if (!value) continue;
                    const fact = el("div", "fact");
                    fact.appendChild(el("span", "eyebrow", label));
                    fact.appendChild(el("b", "", value));
                    facts.appendChild(fact);
                }
                card.appendChild(facts);

                if (p.top_awards && p.top_awards.length) {
                    const awards = el("div", "awards");
                    for (const award of p.top_awards) awards.appendChild(el("span", "award", award));
                    card.appendChild(awards);
                }
                const from = [p.college && "College: " + p.college, p.birthplace && "From " + p.birthplace];
                if (from.some(Boolean)) card.appendChild(el("p", "profile-foot", from.filter(Boolean).join(" · ")));
                return card;
            }

            // Side-by-side stats for two (or more) players; the better number in each row is highlighted.
            function headToHead(players) {
                const card = el("div", "card h2h");
                card.appendChild(el("span", "eyebrow", "Head to head"));
                const table = el("table");
                const head = el("tr");
                head.appendChild(el("th"));
                for (const p of players) {
                    const th = el("th");
                    const known = PLAYERS.find(([name]) => name === p.player);
                    if (known) {
                        const img = el("img");
                        img.src = headshotUrl(known[1]);
                        img.alt = "";
                        img.onerror = () => img.remove();
                        th.appendChild(img);
                    }
                    th.appendChild(document.createTextNode(p.player));
                    th.appendChild(el("small", "", p.season.replace(" regular season", "")));
                    head.appendChild(th);
                }
                table.appendChild(head);
                for (const stat of ["PTS", "REB", "AST", "FG%", "3P%", "FT%"]) {
                    const values = players.map((p) => p.season_averages[stat]);
                    const best = Math.max(...values.filter((v) => v !== undefined));
                    const row = el("tr");
                    row.appendChild(el("td", "stat", stat));
                    for (const v of values) {
                        const td = el("td", v === best ? "win" : "");
                        td.appendChild(el("span", "", v === undefined ? "–" : v));
                        row.appendChild(td);
                    }
                    table.appendChild(row);
                }
                card.appendChild(table);
                return card;
            }

            // The real Reddit replies behind a pushback answer, collapsed by default.
            function redditReplies(data) {
                const box = el("details", "card");
                box.appendChild(el("summary", "", "See what Redditors actually said"));
                const lists = [
                    ["Arguments against it", data.counterarguments],
                    ["How the original poster defended it", data.op_defenses],
                ];
                for (const [heading, items] of lists) {
                    if (!items || !items.length) continue;
                    box.appendChild(el("span", "eyebrow", heading));
                    const ul = el("ul");
                    for (const item of items) ul.appendChild(el("li", "", item.text));
                    box.appendChild(ul);
                }
                return box;
            }

            function actionsRow(calls, copyText) {
                const row = el("div", "actions");
                if (copyText) {
                    const copy = el("button", "pill", "Copy take");
                    copy.addEventListener("click", async () => {
                        try {
                            await navigator.clipboard.writeText(copyText);
                            copy.textContent = "Copied ✓";
                        } catch {
                            copy.textContent = "Couldn't copy";
                        }
                        setTimeout(() => (copy.textContent = "Copy take"), 1500);
                    });
                    row.appendChild(copy);
                }
                const names = [...new Set(calls.map((c) => TOOL_LABELS[c.name] || c.name))];
                row.appendChild(el("span", "tools-used", [...names, now()].join(" · ")));
                return row;
            }

            // --- Filling an assistant message ---

            function fillAssistant(stack, data) {
                stack.innerHTML = "";

                const calls = data.tool_calls || [];
                const results = (name) =>
                    calls.filter((c) => c.name === name).map((c) => parse(c.result)).filter((r) => !r.error);
                const stats = results("get_stat_receipts");
                const pushback = results("prep_for_pushback")[0];
                const profile = results("get_player_profile")[0];

                const { intro, parts } = sections(data.response);
                const takeText = partText(parts, "the take");

                // Show the Reddit post the model actually used: it names it on a "Take id:" line.
                // (find_hot_takes returns several, and the model may skip ones that aren't opinions.)
                const allTakes = results("find_hot_takes").flatMap((r) => r.takes || []);
                const takeId = partText(parts, "take id").replace(/[^a-z0-9]/gi, "").toLowerCase();
                const take = allTakes.find((t) => t.id === takeId) || closestTake(allTakes, takeText);

                // A player profile goes first, whatever else the answer contains.
                if (profile) place(stack, profileCard(profile));

                if (takeText && take) {
                    // A take: take card, receipt block, and the comeback.
                    if (intro) place(stack, botBubble(clean(intro)));
                    place(stack, takeCard(takeText, take));
                    const receipt = receiptBlock(stats[0]);
                    if (receipt) place(stack, receipt);
                    const receiptText = partText(parts, "the receipt");
                    if (receiptText) place(stack, el("p", "receipt-note", receiptText));
                    const comeback = partText(parts, "if they push back");
                    if (comeback) place(stack, pushbackCard(comeback));
                    place(stack, actionsRow(calls, takeText));
                } else if (parts.some((p) => ["they'll say", "you say", "say this"].includes(p.label))) {
                    // An argument: what your friend will say and what you say back.
                    if (intro) place(stack, botBubble(clean(intro)));
                    place(stack, argumentCard(parts));
                    if (stats.length >= 2) place(stack, headToHead(stats));
                    if (pushback) place(stack, redditReplies(pushback));
                    place(stack, actionsRow(calls));
                } else {
                    // Anything else (greetings, errors, off-topic): a plain bubble.
                    const bubble = el("div", "bubble bot");
                    bubble.innerHTML = renderPlain(data.response.replace(/\*\*Take id:\*\*.*$/gim, ""));
                    bubble.appendChild(el("span", "time", now()));
                    place(stack, bubble);
                    if (stats.length >= 2) place(stack, headToHead(stats));
                    if (pushback) place(stack, redditReplies(pushback));
                    if (calls.length) place(stack, actionsRow(calls));
                }
            }

            // --- Sending ---

            function addUser(text) {
                const row = el("div", "row user rise");
                const bubble = el("div", "bubble me", text);
                bubble.appendChild(el("span", "time", now()));
                const stack = el("div", "stack");
                stack.appendChild(bubble);
                row.appendChild(stack);
                messages.appendChild(row);
            }

            // A bot row: ball avatar + a stack that starts as the typing indicator.
            function addAssistant() {
                const row = el("div", "row bot");
                row.appendChild(ball(30));
                const stack = el("div", "stack");
                const typing = el("div", "typing");
                typing.appendChild(document.getElementById("shot-template").content.firstElementChild.cloneNode(true));
                typing.appendChild(el("small", "", "Generating original thoughts…"));
                stack.appendChild(typing);
                row.appendChild(stack);
                messages.appendChild(row);
                return stack;
            }

            async function send(text) {
                text = (text || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                closeSheet();
                welcome.hidden = true;
                userInput.value = "";
                sendBtn.disabled = true;
                addUser(text);
                const stack = addAssistant();
                scrollDown();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });
                    if (!res.ok) throw new Error("Server said " + res.status);
                    const data = await res.json();
                    sessionId = data.session_id;
                    sessionStorage.setItem("ballKnowledgeSession", sessionId);
                    fillAssistant(stack, data);
                } catch (e) {
                    stack.innerHTML = "";
                    const bubble = botBubble("", true);
                    bubble.prepend(
                        el("span", "error", "Couldn't reach Ball Knowledge (" + e.message + "). Check your connection and try again."),
                    );
                    stack.appendChild(bubble);
                }
                sendBtn.disabled = false;
                userInput.focus();
                scrollDown();
            }

            function newChat() {
                if (sessionId) {
                    fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" }).catch(() => {});
                }
                sessionId = null;
                sessionStorage.removeItem("ballKnowledgeSession");
                messages.innerHTML = "";
                welcome.hidden = false;
                userInput.focus();
            }

            // --- Bottom sheet with the player carousel ---

            let pickedPlayer = PLAYERS[0][0];

            function pickPlayer(button, name) {
                pickedPlayer = name;
                document.querySelectorAll(".player").forEach((p) => p.classList.toggle("on", p === button));
                button.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
                const picked = document.getElementById("picked");
                picked.textContent = name;
                picked.appendChild(el("small", "", "Tap below for a real take + stat receipt"));
                document.getElementById("go").textContent = "Get a take on " + name.split(" ").pop();
            }

            function buildCarousel() {
                const carousel = document.getElementById("carousel");
                for (const [name, id] of PLAYERS) {
                    const button = el("button", "player");
                    button.setAttribute("aria-label", name);
                    const shot = el("div", "headshot", name.split(" ").map((w) => w[0]).join(""));
                    const img = el("img");
                    img.src = headshotUrl(id);
                    img.alt = "";
                    img.loading = "lazy";
                    img.onerror = () => img.remove(); // fall back to initials
                    shot.appendChild(img);
                    button.appendChild(shot);
                    button.addEventListener("click", () => pickPlayer(button, name));
                    carousel.appendChild(button);
                }
            }

            function openSheet() {
                document.getElementById("menu").hidden = true;
                windowEl.classList.add("sheet-open");
                // "My friend disagrees" only makes sense after the agent has said something.
                document.getElementById("friend-option").hidden = messages.children.length === 0;
                pickPlayer(document.querySelector(".player"), PLAYERS[0][0]);
            }

            function closeSheet() {
                windowEl.classList.remove("sheet-open");
            }

            // --- Wiring ---

            document.getElementById("orb").appendChild(ball(104));
            document.getElementById("head-avatar").prepend(ball(38));
            buildCarousel();

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") send();
            });
            document.querySelectorAll("[data-prompt]").forEach((b) => b.addEventListener("click", () => send(b.dataset.prompt)));
            document.querySelectorAll("[data-action=players]").forEach((b) => b.addEventListener("click", openSheet));
            document.querySelector("[data-action=new]").addEventListener("click", () => {
                document.getElementById("menu").hidden = true;
                newChat();
            });
            document.getElementById("more-btn").addEventListener("click", () => {
                const menu = document.getElementById("menu");
                menu.hidden = !menu.hidden;
            });
            document.getElementById("menu-btn").addEventListener("click", openSheet);
            document.getElementById("sheet-close").addEventListener("click", closeSheet);
            document.getElementById("scrim").addEventListener("click", closeSheet);
            document.getElementById("go").addEventListener("click", () => send("Give me a niche take about " + pickedPlayer));
            userInput.focus();
        </script>
    </body>
</html>
