<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ball Knowledge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0e1117;
                --surface: #161b24;
                --surface-2: #1d2430;
                --line: #262e3b;
                --text: #e9edf3;
                --muted: #8b95a5;
                --accent: #ff7a1a;
                --gold: #ffc857;
                --display: "Anton", Impact, "Arial Narrow", sans-serif;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            button {
                font: inherit;
                cursor: pointer;
            }

            /* --- Header --- */
            header {
                position: sticky;
                top: 0;
                z-index: 2;
                background: rgba(14, 17, 23, 0.9);
                backdrop-filter: blur(8px);
                border-bottom: 1px solid var(--line);
            }
            .bar {
                max-width: 760px;
                margin: 0 auto;
                padding: 0.85rem 1rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 0.55rem;
                font-family: var(--display);
                font-size: 1.35rem;
                letter-spacing: 0.04em;
                white-space: nowrap;
            }
            .brand .ball {
                font-size: 1.3rem;
            }
            #new-chat {
                background: none;
                border: 1px solid var(--line);
                color: var(--muted);
                border-radius: 999px;
                padding: 0.4rem 0.9rem;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            #new-chat:hover {
                color: var(--text);
                border-color: var(--muted);
            }

            /* --- Layout --- */
            main {
                flex: 1;
                width: 100%;
                max-width: 760px;
                margin: 0 auto;
                padding: 0 1rem;
                display: flex;
                flex-direction: column;
            }

            /* --- Welcome (shown until the first message) --- */
            #welcome {
                text-align: center;
                padding: 3.5rem 0 2rem;
            }
            #welcome h1 {
                font-family: var(--display);
                font-weight: 400;
                font-size: clamp(2rem, 7vw, 3rem);
                letter-spacing: 0.02em;
                line-height: 1.1;
            }
            #welcome h1 span {
                color: var(--accent);
            }
            #welcome p {
                color: var(--muted);
                margin: 0.75rem auto 0;
                max-width: 32rem;
                line-height: 1.5;
            }
            .steps {
                list-style: none;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.5rem 1.5rem;
                margin-top: 1.75rem;
                font-size: 0.9rem;
                color: var(--muted);
            }
            .steps b {
                display: inline-grid;
                place-items: center;
                width: 1.4rem;
                height: 1.4rem;
                margin-right: 0.4rem;
                border-radius: 50%;
                background: var(--surface-2);
                color: var(--accent);
                font-size: 0.75rem;
            }

            /* --- Messages --- */
            #messages {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem 0;
            }
            .msg.user {
                align-self: flex-end;
                max-width: 80%;
                background: var(--surface-2);
                padding: 0.65rem 1rem;
                border-radius: 18px 18px 4px 18px;
                line-height: 1.5;
            }
            .msg.assistant {
                display: flex;
                gap: 0.75rem;
                align-items: flex-start;
            }
            .avatar {
                flex: none;
                width: 2rem;
                height: 2rem;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--surface-2);
                font-size: 1.05rem;
            }
            .body {
                flex: 1;
                min-width: 0;
                line-height: 1.6;
            }
            .text strong {
                color: var(--gold);
                font-weight: 600;
            }
            .text ul {
                margin: 0.4rem 0 0 1.2rem;
            }
            .error {
                color: #ff9aa5;
            }

            /* --- Loading: bouncing basketball --- */
            .thinking {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                color: var(--muted);
                font-style: italic;
                min-height: 2rem;
            }
            .thinking .bounce {
                display: inline-block;
                font-size: 1.3rem;
                animation: bounce 0.6s cubic-bezier(0.5, 0, 0.5, 1) infinite alternate;
            }
            @keyframes bounce {
                from {
                    transform: translateY(-6px) rotate(0deg);
                }
                to {
                    transform: translateY(4px) rotate(90deg);
                }
            }
            .dots::after {
                content: "";
                animation: dots 1.2s steps(4) infinite;
            }
            @keyframes dots {
                0% {
                    content: "";
                }
                25% {
                    content: ".";
                }
                50% {
                    content: "..";
                }
                75% {
                    content: "...";
                }
            }

            /* --- Take card --- */
            .card {
                margin-top: 0.9rem;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 0.9rem 1rem;
            }
            .card-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
                font-size: 0.8rem;
                color: var(--muted);
            }
            .chilis {
                letter-spacing: 0.05em;
            }
            .chilis .off {
                filter: grayscale(1);
                opacity: 0.25;
            }
            .spice-label {
                margin-left: 0.35rem;
                font-weight: 600;
                color: var(--accent);
            }
            .card a {
                color: var(--muted);
            }
            .card a:hover {
                color: var(--text);
            }
            .card-title {
                margin: 0.5rem 0 0;
                font-weight: 500;
            }
            .stat {
                margin-top: 0.6rem;
                font-size: 0.85rem;
                color: var(--gold);
            }
            details {
                margin-top: 0.75rem;
                font-size: 0.88rem;
            }
            summary {
                cursor: pointer;
                color: var(--muted);
            }
            summary:hover {
                color: var(--text);
            }
            details h4 {
                margin-top: 0.6rem;
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
            }
            details ul {
                margin: 0.3rem 0 0 1.1rem;
            }
            details li {
                margin-bottom: 0.3rem;
            }
            .copy {
                margin-top: 0.6rem;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.8rem;
                padding: 0;
            }
            .copy:hover {
                color: var(--text);
            }

            /* --- Composer --- */
            .composer {
                position: sticky;
                bottom: 0;
                margin-top: auto;
                padding: 0.75rem 0 1.25rem;
                background: linear-gradient(transparent, var(--bg) 25%);
            }
            .chips {
                display: flex;
                gap: 0.5rem;
                overflow-x: auto;
                padding-bottom: 0.6rem;
                scrollbar-width: none;
            }
            .chip {
                flex: none;
                background: var(--surface);
                border: 1px solid var(--line);
                color: var(--text);
                border-radius: 999px;
                padding: 0.45rem 0.85rem;
                font-size: 0.85rem;
            }
            .chip:hover {
                border-color: var(--accent);
            }
            .input-row {
                display: flex;
                gap: 0.5rem;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 0.35rem;
            }
            .input-row:focus-within {
                border-color: var(--accent);
            }
            #user-input {
                flex: 1;
                min-width: 0;
                background: none;
                border: none;
                outline: none;
                color: var(--text);
                font: inherit;
                padding: 0.6rem 0.7rem;
            }
            #send-btn {
                background: var(--accent);
                color: #1a0d00;
                border: none;
                border-radius: 10px;
                padding: 0 1.1rem;
                font-weight: 700;
            }
            button:disabled {
                opacity: 0.4;
                cursor: wait;
            }

            @media (max-width: 600px) {
                .brand {
                    font-size: 1.1rem;
                }
                #welcome {
                    padding-top: 2rem;
                }
                .steps {
                    flex-direction: column;
                    align-items: center;
                }
                .msg.user {
                    max-width: 90%;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="bar">
                <div class="brand"><span class="ball">🏀</span>BALL KNOWLEDGE</div>
                <button id="new-chat">New chat</button>
            </div>
        </header>

        <main>
            <section id="welcome">
                <h1>Sound like you <span>watch every game.</span></h1>
                <p>
                    Friends into the NBA and you're not? Get a real, spicy take from Reddit fans, backed
                    by a real stat, plus what to say when they push back.
                </p>
                <ol class="steps">
                    <li><b>1</b>Ask for a take</li>
                    <li><b>2</b>Drop it in the group chat</li>
                    <li><b>3</b>Ask how to respond if they disagree</li>
                </ol>
            </section>

            <div id="messages"></div>

            <div class="composer">
                <div class="chips">
                    <button class="chip" data-prompt="Give me a niche take">🌶️ Give me a niche take</button>
                    <button class="chip" data-prompt="Give me a niche take about Stephen Curry">
                        A take about Stephen Curry
                    </button>
                    <button class="chip" data-prompt="My friend says that's a terrible take, what do I say?">
                        My friend disagrees. What do I say?
                    </button>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="user-input"
                        placeholder="Ask for a take about any player or team…"
                        autocomplete="off"
                        maxlength="500"
                    />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>

        <script>
            const messages = document.getElementById("messages");
            const welcome = document.getElementById("welcome");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");

            // Each browser tab is its own session: sessionStorage is per-tab.
            let sessionId = sessionStorage.getItem("ballKnowledgeSession");

            // --- Small helpers ---

            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Escape first, then allow only **bold**, "- " / "* " bullets and line breaks.
            // Models sometimes write markdown escapes like "\#1"; drop the backslash.
            function renderText(text) {
                const lines = escapeHtml((text || "").replace(/\\([#*_\-])/g, "$1")).split("\n");
                let html = "";
                let inList = false;
                for (const line of lines) {
                    const bullet = line.match(/^\s*[-*]\s+(.*)/);
                    if (bullet && !inList) html += "<ul>";
                    if (!bullet && inList) html += "</ul>";
                    inList = Boolean(bullet);
                    html += bullet ? "<li>" + bullet[1] + "</li>" : line + "<br>";
                }
                if (inList) html += "</ul>";
                return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            }

            function parse(result) {
                try {
                    return JSON.parse(result);
                } catch {
                    return {};
                }
            }

            function scrollDown() {
                window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
            }

            // --- Building an assistant message ---

            function chiliMeter(level) {
                const meter = el("span", "chilis");
                for (let i = 1; i <= 5; i++) meter.appendChild(el("span", i <= level ? "" : "off", "🌶️"));
                return meter;
            }

            function takeCard(take, stats, pushback) {
                const card = el("div", "card");

                const top = el("div", "card-top");
                const spice = el("div");
                spice.appendChild(chiliMeter(take.spice));
                spice.appendChild(el("span", "spice-label", take.spice + "/5 " + take.spice_label));
                top.appendChild(spice);
                const link = el("a", "", "r/" + take.subreddit + " ↗");
                link.href = take.url;
                link.target = "_blank";
                link.rel = "noopener";
                top.appendChild(link);
                card.appendChild(top);

                card.appendChild(el("p", "card-title", "“" + take.title + "”"));
                if (stats && stats.biggest_swings && stats.biggest_swings.length) {
                    const swing = stats.biggest_swings[0];
                    card.appendChild(el("p", "stat", "📊 " + stats.season + ": " + swing.line));
                }
                if (pushback) card.appendChild(pushbackDetails(pushback));
                return card;
            }

            // The real Reddit replies behind a pushback answer, collapsed by default.
            function pushbackDetails(data) {
                const box = el("details");
                box.appendChild(el("summary", "", "See what Redditors actually said"));
                const lists = [
                    ["Arguments against it", data.counterarguments],
                    ["How the original poster defended it", data.op_defenses],
                ];
                for (const [heading, items] of lists) {
                    if (!items || !items.length) continue;
                    box.appendChild(el("h4", "", heading));
                    const ul = el("ul");
                    for (const item of items) ul.appendChild(el("li", "", item.text));
                    box.appendChild(ul);
                }
                return box;
            }

            // The "The take:" line from the answer, without markdown. Falls back to the whole answer.
            function takeLine(text) {
                const match = (text || "").match(/\*\*The take:\*\*\s*(.+)/);
                return (match ? match[1] : text).replace(/\*\*/g, "").trim();
            }

            function addAssistant() {
                const div = el("div", "msg assistant");
                div.appendChild(el("div", "avatar", "🏀"));
                const body = el("div", "body");
                const thinking = el("div", "thinking");
                thinking.appendChild(el("span", "bounce", "🏀"));
                thinking.appendChild(el("span", "dots", "Generating original thoughts"));
                body.appendChild(thinking);
                div.appendChild(body);
                messages.appendChild(div);
                return body;
            }

            function fillAssistant(body, data) {
                body.innerHTML = "";
                const text = el("div", "text");
                text.innerHTML = renderText(data.response);
                body.appendChild(text);

                // The tool results drive the card; the raw tool calls stay out of the UI.
                const calls = data.tool_calls || [];
                const resultOf = (name) => {
                    const call = calls.find((c) => c.name === name);
                    return call ? parse(call.result) : null;
                };
                const found = resultOf("find_hot_takes");
                const stats = resultOf("get_stat_receipts");
                const pushback = resultOf("prep_for_pushback");
                const take = found && found.takes && found.takes[0];
                const validPushback = pushback && !pushback.error ? pushback : null;

                if (take && takeLine(data.response) !== data.response) {
                    // Only show the card when the answer is actually presenting a take.
                    body.appendChild(takeCard(take, stats && !stats.error ? stats : null, validPushback));
                    const copy = el("button", "copy", "📋 Copy take");
                    copy.addEventListener("click", async () => {
                        try {
                            await navigator.clipboard.writeText(takeLine(data.response));
                            copy.textContent = "✓ Copied";
                        } catch {
                            copy.textContent = "Couldn't copy";
                        }
                        setTimeout(() => (copy.textContent = "📋 Copy take"), 1500);
                    });
                    body.appendChild(copy);
                } else if (validPushback) {
                    body.appendChild(pushbackDetails(validPushback));
                }
            }

            // --- Sending ---

            async function send(text) {
                text = (text || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                welcome.hidden = true;
                userInput.value = "";
                sendBtn.disabled = true;
                messages.appendChild(el("div", "msg user", text));
                const body = addAssistant();
                scrollDown();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });
                    if (!res.ok) throw new Error("Server said " + res.status);
                    const data = await res.json();
                    sessionId = data.session_id;
                    sessionStorage.setItem("ballKnowledgeSession", sessionId);
                    fillAssistant(body, data);
                } catch (e) {
                    body.innerHTML = "";
                    body.appendChild(
                        el(
                            "p",
                            "error",
                            "Couldn't reach Ball Knowledge (" + e.message + "). Check your connection and try again.",
                        ),
                    );
                }
                sendBtn.disabled = false;
                userInput.focus();
                scrollDown();
            }

            function newChat() {
                if (sessionId) {
                    fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" }).catch(() => {});
                }
                sessionId = null;
                sessionStorage.removeItem("ballKnowledgeSession");
                messages.innerHTML = "";
                welcome.hidden = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") send();
            });
            document.querySelectorAll(".chip").forEach((chip) =>
                chip.addEventListener("click", () => send(chip.dataset.prompt)),
            );
            document.getElementById("new-chat").addEventListener("click", newChat);
            userInput.focus();
        </script>
    </body>
</html>
